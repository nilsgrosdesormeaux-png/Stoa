<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stoa</title>
<meta name="description" content="Stoa : ton carnet de musculation.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stoa">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0A0C">
<style>
  :root{
    --bg:#F2F2F5; --panel:#FFFFFF; --panel-2:#F4F4F7; --line:rgba(10,10,12,.09);
    --ink:#0A0A0C; --ink-2:#5B5B66; --ink-3:#7A7A85;
    --hot:#D70F25; --hot-ink:#ffffff; --hot-soft:rgba(215,15,37,.09);
    --go:#1F9E3A; --go-ink:#ffffff; --go-soft:rgba(31,158,58,.11);
    --warn:#B87400; --warn-soft:rgba(217,138,0,.12);
    --hero:#141417; --hero-ink:#F5F5F7;
    --art-bg:#E9E9EE; --art-frame:#A7A7B2; --art-pad:#C9C9D2; --art-metal:#8E8E98; --art-ink:#0A0A0C;
    --s1:#FFFFFF; --s2:#F4F4F7; --s3:#E9E9EE; --line-2:rgba(10,10,12,.10);
    --red:#D70F25; --red-hi:#F0263D; --red-deep:#8E0A19; --red-soft:rgba(215,15,37,.09);
    --grad:linear-gradient(135deg,#FF4757 0%,#E8132B 45%,#9E0B1E 100%);
    --pr:#D98A00; --pr-soft:rgba(217,138,0,.12); --up:#1F9E3A; --up-soft:rgba(31,158,58,.11); --track:rgba(10,10,12,.07);
    --r-xl:28px; --r-l:22px; --r-m:16px; --r-s:10px;
    --sh:0 1px 2px rgba(10,10,12,.04),0 8px 24px rgba(10,10,12,.06);
    --sh-red:0 10px 24px rgba(215,15,37,.30),0 2px 0 rgba(255,255,255,.25) inset;
    --tab:rgba(255,255,255,.78); --bg-glow:rgba(215,15,37,.08); --ease:cubic-bezier(.22,1,.36,1);
    --radius:20px; --shadow:0 10px 30px rgba(0,0,0,.16);
    --tabh:74px; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A0A0C; --panel:#141417; --panel-2:#1C1C21; --line:rgba(255,255,255,.08);
      --ink:#F5F5F7; --ink-2:#B4B4BC; --ink-3:#8A8A94;
      --hot:#FF4757; --hot-ink:#ffffff; --hot-soft:rgba(232,19,43,.16);
      --go:#32D74B; --go-ink:#06240E; --go-soft:rgba(50,215,75,.14);
      --warn:#FFB224; --warn-soft:rgba(255,178,36,.14);
      --hero:#1C1C21; --hero-ink:#F5F5F7;
      --art-bg:#1C1C21; --art-frame:#5E5E69; --art-pad:#4A4A55; --art-metal:#76768A; --art-ink:#E8E7E1;
      --s1:#141417; --s2:#1C1C21; --s3:#26262C; --line-2:rgba(255,255,255,.12);
      --red:#E8132B; --red-hi:#FF4757; --red-deep:#7A0A17; --red-soft:rgba(232,19,43,.14);
      --pr:#FFB224; --pr-soft:rgba(255,178,36,.14); --up:#32D74B; --up-soft:rgba(50,215,75,.14); --track:rgba(255,255,255,.08);
      --sh:0 1px 0 rgba(255,255,255,.04) inset,0 12px 32px rgba(0,0,0,.45);
      --sh-red:0 10px 30px rgba(232,19,43,.45),0 2px 0 rgba(255,255,255,.18) inset;
      --tab:rgba(20,20,23,.72); --bg-glow:rgba(232,19,43,.22);
      --shadow:0 10px 30px rgba(0,0,0,.55);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A0A0C; --panel:#141417; --panel-2:#1C1C21; --line:rgba(255,255,255,.08);
    --ink:#F5F5F7; --ink-2:#B4B4BC; --ink-3:#8A8A94;
    --hot:#FF4757; --hot-ink:#ffffff; --hot-soft:rgba(232,19,43,.16);
    --go:#32D74B; --go-ink:#06240E; --go-soft:rgba(50,215,75,.14);
    --warn:#FFB224; --warn-soft:rgba(255,178,36,.14);
    --hero:#1C1C21; --hero-ink:#F5F5F7;
    --art-bg:#1C1C21; --art-frame:#5E5E69; --art-pad:#4A4A55; --art-metal:#76768A; --art-ink:#E8E7E1;
    --s1:#141417; --s2:#1C1C21; --s3:#26262C; --line-2:rgba(255,255,255,.12);
    --red:#E8132B; --red-hi:#FF4757; --red-deep:#7A0A17; --red-soft:rgba(232,19,43,.14);
    --pr:#FFB224; --pr-soft:rgba(255,178,36,.14); --up:#32D74B; --up-soft:rgba(50,215,75,.14); --track:rgba(255,255,255,.08);
    --sh:0 1px 0 rgba(255,255,255,.04) inset,0 12px 32px rgba(0,0,0,.45);
    --sh-red:0 10px 30px rgba(232,19,43,.45),0 2px 0 rgba(255,255,255,.18) inset;
    --tab:rgba(20,20,23,.72); --bg-glow:rgba(232,19,43,.22);
    --shadow:0 10px 30px rgba(0,0,0,.55);
    color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  html,body{overscroll-behavior-y:none}
  body{margin:0;background:var(--bg);color:var(--ink);background-image:radial-gradient(120% 50% at 50% -10%,var(--bg-glow),transparent 60%);background-repeat:no-repeat;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button,input,textarea{font:inherit;color:inherit}
  button{-webkit-user-select:none;user-select:none;touch-action:manipulation;cursor:pointer}
  .wrap{max-width:680px;margin:0 auto;padding:0 16px calc(var(--tabh) + var(--sab) + 120px)}
  .num{font-variant-numeric:tabular-nums}

  /* en-tête */
  .top{position:sticky;top:0;z-index:15;margin:0 -16px;padding:calc(10px + var(--sat)) 16px 10px;
    background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
    border-bottom:.5px solid transparent;display:flex;align-items:center;gap:8px}
  .top.scrolled{border-bottom-color:var(--line)}
  .top h1{flex:1;margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{font-size:13px;color:var(--ink-2);background:var(--panel-2);border:0;border-radius:99px;padding:0 12px;height:36px;display:flex;align-items:center;gap:4px}
  .chip b{color:var(--ink)}
  .icon-btn{appearance:none;border:0;background:var(--panel-2);width:44px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none}
  .icon-btn svg{width:20px;height:20px}
  .big-title{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:8px 0 4px}
  h2{font-size:24px;font-weight:800;letter-spacing:-.025em;margin:22px 0 4px;line-height:1.15}
  h3{font-size:13px;margin:28px 0 10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
  .lead{color:var(--ink-2);font-size:15px;margin:0 0 14px}
  .small{font-size:13.5px}
  .muted{color:var(--ink-3)}
  .panel{background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .panel.flat{padding:0;overflow:hidden}
  .panel p{margin:0}
  .panel p+p{margin-top:10px}

  /* barre d'onglets */
  .tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + var(--sab));z-index:25;width:calc(100% - 24px);max-width:440px;height:64px;
    display:grid;grid-template-columns:repeat(5,1fr);border-radius:24px;background:var(--tab);border:1px solid var(--line-2);
    -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .tabbar button{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-size:10.5px;font-weight:600;color:var(--ink-3)}
  .tabbar svg{width:24px;height:24px}
  .tabbar button[aria-selected="true"]{color:var(--hot)}

  /* sélecteur de séance */
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel-2);padding:4px;border-radius:14px;margin:6px 0 14px}
  .seg button{appearance:none;border:0;background:none;height:40px;border-radius:10px;font-weight:700;font-size:14.5px;color:var(--ink-2);position:relative}
  .seg button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .seg button .ck{position:absolute;top:3px;right:6px;font-size:11px;color:var(--go)}
  .musc{font-size:15px;font-weight:600;color:var(--ink-2);margin:0 0 2px}
  details.about{margin:4px 0 12px}
  details.about summary{cursor:pointer;font-size:14px;color:var(--ink-3);font-weight:600;list-style:none;padding:6px 0}
  details.about summary::-webkit-details-marker{display:none}
  details.about p{margin:4px 0 0;font-size:14.5px;color:var(--ink-2)}

  .banner{border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px;background:var(--warn-soft);color:var(--ink)}
  .banner b{color:var(--warn)}
  .banner.info{background:var(--panel-2)}

  /* progression collante */
  .sprog{position:sticky;top:calc(56px + var(--sat));z-index:12;margin:0 -16px 12px;padding:8px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .sprog .row{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
  .sprog .row b{color:var(--ink)}
  .sprog .dots{display:flex;gap:6px;margin-left:auto}
  .sprog .dots button{appearance:none;border:0;width:22px;height:22px;border-radius:99px;background:var(--panel-2);font-size:11px;font-weight:800;color:var(--ink-3);padding:0}
  .sprog .dots button.on{background:var(--ink);color:var(--bg)}
  .sprog .dots button.ok{background:var(--go);color:var(--go-ink)}
  .bar{height:6px;border-radius:9px;background:var(--panel-2);overflow:hidden;margin-top:7px}
  .bar i{display:block;height:100%;background:var(--go);border-radius:9px;transition:width .3s}

  /* carte exercice */
  .exo{background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;scroll-margin-top:calc(110px + var(--sat))}
  .exo.active{border-color:color-mix(in srgb,var(--ink) 35%,var(--line))}
  .exo.full{border-color:var(--go)}
  .exo-hd{display:flex;gap:12px;padding:12px 12px 10px}
  .thumb{appearance:none;border:0;padding:0;width:88px;height:88px;border-radius:14px;overflow:hidden;flex:none;background:var(--art-bg);position:relative}
  .thumb img,.thumb svg{display:block;width:100%;height:100%;object-fit:cover}
  .thumb .n{position:absolute;top:5px;left:5px;min-width:22px;height:22px;border-radius:7px;background:var(--panel);color:var(--ink-2);
    font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}
  .exo.full .thumb .n{background:var(--go);color:var(--go-ink)}
  .exo-ti{flex:1;min-width:0}
  .exo-ti h4{margin:0 0 3px;font-size:17px;line-height:1.22;letter-spacing:-.015em;font-weight:700}
  .exo-ti .meta{font-size:14px;color:var(--ink-2)}
  .exo-ti .meta b{color:var(--ink)}
  .exo-ti .tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--hot-soft);color:var(--hot);margin-top:5px}
  .exo-ti .tag.opt{background:var(--panel-2);color:var(--ink-2)}
  .reg{display:flex;align-items:center;gap:8px;margin:0 12px 8px;font-size:13.5px;color:var(--ink-2)}
  .reg button{appearance:none;border:0;background:none;color:var(--ink-2);padding:6px 0;text-align:left;min-height:32px}
  .reg button b{color:var(--ink)}
  .reg input{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px 10px;font-size:15px}
  .tip{margin:0 12px 10px;padding:10px 12px;border-radius:12px;font-size:14px;background:var(--go-soft);color:var(--ink)}
  .tip b{color:var(--go)}
  .tip.down{background:var(--warn-soft)}
  .tip.down b{color:var(--warn)}
  .tip.info{background:var(--panel-2)}

  .sets{background:var(--panel-2);padding:10px 10px 12px}
  .sets-hd,.set{display:grid;grid-template-columns:34px 1fr 1fr 56px;gap:8px;align-items:center}
  .sets-hd{padding:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;text-align:center}
  .set{margin-bottom:8px}
  .set .n{font-weight:800;font-size:15px;color:var(--ink-3);text-align:center}
  .set.warm .n{font-size:12px;color:var(--warn)}
  .set input{width:100%;min-width:0;font-size:22px;font-weight:700;padding:9px 4px;border:1px solid var(--line);border-radius:12px;background:var(--panel);
    text-align:center;font-variant-numeric:tabular-nums;height:50px}
  .set.warm input{font-size:18px;height:44px;color:var(--ink-2)}
  .set input:focus{outline:2px solid var(--hot);outline-offset:-1px;border-color:transparent}
  .set .ok{appearance:none;border:1.5px solid var(--line);background:var(--panel);height:50px;border-radius:12px;display:grid;place-items:center;color:var(--ink-3)}
  .set.warm .ok{height:44px}
  .set .ok svg{width:22px;height:22px}
  .set.done .ok{background:var(--go);border-color:var(--go);color:var(--go-ink)}
  .set.done input{border-color:transparent;background:var(--go-soft)}
  .set.done .n{color:var(--go)}
  .set .pr{grid-column:2/4;font-size:12px;font-weight:700;color:var(--go);margin:-4px 0 2px;text-align:center}
  .side{font-size:12px;color:var(--ink-3);text-align:center;margin:-4px 0 6px}
  .feel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
  .feel button{appearance:none;border:1px solid var(--line);background:var(--panel);border-radius:12px;min-height:44px;font-size:14px;font-weight:600;color:var(--ink-2)}
  .feel button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .feel-q{font-size:13px;font-weight:700;color:var(--ink-2);margin:6px 0 4px}
  .prev{font-size:13.5px;color:var(--ink-2);margin-top:4px}
  .prev b{color:var(--ink)}
  .exo-ft{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
  .exo-ft button{appearance:none;border:0;background:none;color:var(--ink-2);font-weight:600;font-size:14px;min-height:40px;padding:0 4px}
  .exo-ft button:last-child{margin-left:auto}
  .collapsed{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:56px;width:100%;appearance:none;border:0;background:none;text-align:left}
  .collapsed .c{width:26px;height:26px;border-radius:99px;background:var(--go);color:var(--go-ink);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
  .collapsed .t{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .collapsed .s{font-size:13.5px;color:var(--ink-2);white-space:nowrap}

  .btn{appearance:none;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:15.5px;padding:0 18px;min-height:50px;border-radius:14px}
  .btn:active{transform:scale(.98)}
  .btn.hot{background:var(--grad);color:#fff;box-shadow:var(--sh-red)}
  .btn.line{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-weight:600}
  .btn.wide{width:100%}
  .row-in{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .row-in label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;display:flex;flex-direction:column;gap:4px}
  .row-in input{width:96px;font-size:20px;font-weight:700;height:50px;padding:0 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);text-align:center;font-variant-numeric:tabular-nums}

  /* héro + stats */
  .hero{background:radial-gradient(90% 90% at 0% 0%,rgba(232,19,43,.30),transparent 60%),linear-gradient(160deg,#1A0B0E 0%,#0F0F12 70%);color:#F5F5F7;border-radius:24px;padding:18px;margin:8px 0 12px;border:1px solid rgba(255,71,87,.18)}
  .hero small{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;opacity:.7}
  .hero b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.15}
  .hero p{margin:0 0 14px;opacity:.85;font-size:14.5px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
  .stat small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
  .stat b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .stat b i{font-style:normal;font-size:13px;color:var(--ink-3);font-weight:500}

  /* listes iOS */
  .list .li{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:60px;border-bottom:1px solid var(--line);width:100%;appearance:none;border-left:0;border-right:0;border-top:0;background:none;text-align:left}
  .list .li:last-child{border-bottom:0}
  .list .li:active{background:var(--panel-2)}
  .list .li .day{flex:0 0 38px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
  .list .li .w{flex:1;min-width:0}
  .list .li .w b{display:block;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list .li .w small{display:block;color:var(--ink-2);font-size:13.5px}
  .list .li.rest .w b{color:var(--ink-3);font-weight:500}
  .list .li.today{background:var(--hot-soft)}
  .list .li .r{flex:none;font-size:13.5px;font-weight:700;color:var(--go);text-align:right}
  .list .li .r.n{color:var(--ink-3);font-weight:500}
  .list .li .chev{flex:none;color:var(--ink-3);font-size:20px}
  .vol{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:14px;padding:6px 0}
  .vol .b{height:10px;border-radius:9px;background:var(--panel-2);position:relative;overflow:hidden}
  .vol .b i{position:absolute;inset:0 auto 0 0;background:var(--ink-3);border-radius:9px}
  .vol .b i.p{background:var(--hot)}
  .vol span:last-child{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}

  .note{font-size:14px;color:var(--ink-2);margin:12px 0 0!important;padding-top:12px;border-top:1px solid var(--line)}
  .note b{color:var(--ink)}
  ul.clean,ol.clean{margin:0;padding-left:20px;font-size:15px}
  ul.clean li,ol.clean li{margin-bottom:9px}
  ul.clean li:last-child,ol.clean li:last-child{margin-bottom:0}
  .macro{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .macro div{background:var(--panel-2);border-radius:12px;padding:12px}
  .macro small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700}
  .macro b{font-size:19px;font-weight:800}
  .macro span{display:block;font-size:13px;color:var(--ink-2)}
  .spark svg{display:block;width:100%;height:64px}
  .meas{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .meas label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;display:flex;flex-direction:column;gap:4px}
  .meas input{width:100%;font-size:18px;font-weight:700;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);text-align:center}

  /* chrono */
  .timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--sab) + 10px);z-index:30;
    background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px;display:flex;align-items:center;gap:6px;
    box-shadow:var(--shadow);width:min(calc(100% - 20px),460px)}
  .ring{position:relative;width:52px;height:52px;flex:none}
  .ring svg{width:52px;height:52px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:5}
  .ring .bgc{stroke:var(--panel-2)}
  .ring .fg{stroke:var(--hot);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
  .timer .tx{flex:1;min-width:0;padding-left:2px;appearance:none;border:0;background:none;text-align:left}
  .timer .tx b{display:block;font-variant-numeric:tabular-nums;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .timer .tx small{font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
  .timer .tb{appearance:none;border:0;background:var(--panel-2);color:var(--ink);font-size:14px;font-weight:700;min-width:44px;min-height:44px;padding:0 8px;border-radius:12px}
  .timer .tb.x{background:var(--ink);color:var(--bg)}
  .timer.end{background:var(--go);border-color:var(--go);animation:pulse 1s ease-in-out 3}
  .timer.end .tx b,.timer.end .tx small{color:var(--go-ink)}
  .timer.end .ring{display:none}
  .timer.end .tb{background:color-mix(in srgb,var(--go-ink) 15%,transparent);color:var(--go-ink)}
  @keyframes pulse{50%{transform:translateX(-50%) scale(1.04)}}
  .hidden{display:none!important}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--sab) + 84px);background:var(--ink);color:var(--bg);
    padding:10px 14px;border-radius:14px;font-size:14.5px;font-weight:600;z-index:40;box-shadow:var(--shadow);max-width:92%;display:flex;gap:12px;align-items:center}
  .toast button{appearance:none;border:0;background:none;color:var(--hot);font-weight:800;min-height:32px}
  .foot{font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:22px}

  /* feuille modale */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;opacity:0;transition:opacity .2s}
  .sheet-bg.on{opacity:1}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:88vh;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;
    padding:8px 16px calc(20px + var(--sab));transform:translateY(100%);transition:transform .25s ease;max-width:680px;margin:0 auto;-webkit-overflow-scrolling:touch}
  .sheet.on{transform:none}
  .sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
  .sheet .shd{display:flex;align-items:flex-start;gap:10px}
  .sheet .shd h3{flex:1;margin:4px 0 8px;font-size:19px;text-transform:none;letter-spacing:-.01em;color:var(--ink)}
  .sheet .close{appearance:none;border:0;background:var(--panel-2);width:36px;height:36px;border-radius:99px;font-size:18px;color:var(--ink-2);flex:none}
  .sheet .pic{border-radius:16px;overflow:hidden;background:var(--art-bg);margin-bottom:12px}
  .sheet .pic img{display:block;width:100%;max-height:52vh;object-fit:cover}
  .sheet .pic svg{display:block;width:100%;height:auto}
  .sheet h5{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:18px 0 8px}
  .sheet ol,.sheet ul{margin:0;padding-left:20px;font-size:15px;color:var(--ink-2)}
  .sheet li{margin-bottom:8px}
  .sheet p{font-size:15px;color:var(--ink-2);margin:0}
  .alts{display:flex;flex-direction:column;gap:8px}
  .alt{display:flex;gap:10px;align-items:center;background:var(--panel-2);border-radius:12px;padding:8px;font-size:14.5px}
  .alt img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none}
  .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .presets button{appearance:none;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;min-height:52px;font-size:17px;font-weight:700}
  .presets button.on{background:var(--ink);color:var(--bg)}
  .photo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .photo-actions label,.photo-actions button{appearance:none;border:1px solid var(--line);background:var(--panel-2);border-radius:12px;min-height:44px;padding:0 14px;
    display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;cursor:pointer}
  .photo-actions input{display:none}


  .set:not(.done) input.sug{color:var(--ink-3);font-weight:600}
  .thumb .cam{position:absolute;right:5px;bottom:5px;width:26px;height:26px;border-radius:99px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
  .thumb .cam svg{width:15px;height:15px}
  .bar i{background:var(--grad)}
  .tabbar button[aria-selected="true"] svg{filter:drop-shadow(0 0 8px rgba(232,19,43,.55))}
  body.on-home .wrap{padding-top:calc(14px + var(--sat))}
  /* ===== accueil ===== */
  .h-lbl{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
  .h-card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh);padding:18px}
  .h-sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 12px}
  .h-sec h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
  .h-sec a{font-size:14px;font-weight:600;color:var(--red-hi);text-decoration:none}
  :root[data-theme="light"] .home .h-sec a{color:var(--red)}
  .home button{font:inherit;color:inherit;border:0;cursor:pointer}
  .home h3{text-transform:none;letter-spacing:-.025em;color:var(--ink);font-size:22px;font-weight:800;margin:0}
  .home h1,.home h3,.home p{margin:0}
  .home .num{letter-spacing:-.035em}
  .home .h-avatar{color:#fff}
  .home .h-hero .h-ring .h-c b{color:#F5F5F7}
/* header */
.h-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.h-hd .h-date{font-size:13px;font-weight:600;color:var(--ink-3);text-transform:capitalize}
.h-hd h1{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin-top:2px}
.h-hd .h-r{display:flex;gap:8px;align-items:center}
.h-icon-btn{width:40px;height:40px;border-radius:50%;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center}
.h-icon-btn svg{width:20px;height:20px}
.h-avatar{width:40px;height:40px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;box-shadow:var(--sh-red)}

/* hero */
.h-hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:16px 18px;background:
  radial-gradient(90% 90% at 0% 0%,rgba(232,19,43,.30),transparent 60%),
  linear-gradient(160deg,#1A0B0E 0%,#0F0F12 70%);border:1px solid rgba(255,71,87,.18);color:#F5F5F7;
  box-shadow:0 20px 50px rgba(0,0,0,.5)}
:root[data-theme="light"] .home .h-hero{box-shadow:0 18px 40px rgba(122,10,23,.25)}
.h-hero::after{content:"";position:absolute;right:-60px;bottom:-60px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,71,87,.18),transparent 70%)}
.h-hero-top{display:flex;align-items:center;gap:18px;position:relative;z-index:1}
.h-ring{width:112px;height:112px;flex:none;position:relative}
.h-ring svg{width:100%;height:100%;overflow:visible}
.h-ring .h-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.h-ring .h-c b{font-size:38px;font-weight:800;line-height:1}
.h-ring .h-c b small{font-size:20px;color:rgba(245,245,247,.45);font-weight:700}
.h-ring .h-c span{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:rgba(245,245,247,.55);margin-top:4px}
.h-arc{transition:stroke-dashoffset 1.1s var(--ease)}
.h-hero-side{flex:1;min-width:0}
.h-streak{display:flex;align-items:center;gap:8px}
.h-streak b{font-size:36px;font-weight:800;line-height:1}
.h-streak svg{width:26px;height:30px;filter:drop-shadow(0 0 10px rgba(255,140,40,.6))}
.h-streak-l{font-size:13px;color:rgba(245,245,247,.6);margin-top:4px;line-height:1.3}
.h-days{display:flex;gap:5px;margin-top:12px}
.h-day{flex:1;text-align:center;font-size:10px;font-weight:700;color:rgba(245,245,247,.4)}
.h-day i{display:block;height:22px;border-radius:7px;background:rgba(255,255,255,.07);margin-top:4px;font-style:normal;font-size:10px;line-height:22px;color:#fff}
.h-day.h-on i{background:var(--grad);box-shadow:0 0 12px rgba(232,19,43,.55)}
.h-day.h-now{color:#fff}
.h-day.h-now i{background:transparent;border:1.5px dashed rgba(255,71,87,.8)}
.h-quote{position:relative;z-index:1;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);font-size:15px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.h-quote em{font-style:normal;color:#FF6B78}

/* next */
.h-next{margin-top:12px;padding:16px 18px;border-radius:var(--r-l);background:var(--s1);border:1px solid var(--line);box-shadow:var(--sh)}
.h-next-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.h-badge-k{width:52px;height:52px;flex:none;border-radius:16px;background:var(--red-soft);color:var(--red-hi);display:grid;place-items:center;font-size:26px;font-weight:800}
:root[data-theme="light"] .home .h-badge-k{color:var(--red)}
.h-next h3{font-size:22px;font-weight:800;letter-spacing:-.025em}
.h-next p{font-size:14px;color:var(--ink-2);margin-top:3px;line-height:1.35}
.h-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.h-chip{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--s2);color:var(--ink-2);border:1px solid var(--line)}
.h-tip{margin-top:12px;font-size:13px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.h-tip svg{width:16px;height:16px;flex:none;color:var(--up)}
.h-tip b{color:var(--ink)}
.h-go{margin-top:16px;width:100%;height:58px;border-radius:18px;background:var(--grad);color:#fff;font-size:18px;font-weight:800;letter-spacing:-.01em;
  display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--sh-red);transition:transform .15s var(--ease)}
.h-go:active{transform:scale(.97)}
.h-go svg{width:22px;height:22px}

/* stats grid */
.h-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.h-stat{padding:16px;border-radius:var(--r-m);background:var(--s1);border:1px solid var(--line);box-shadow:var(--sh);min-width:0}
.h-stat .h-v{font-size:30px;font-weight:800;margin-top:8px;line-height:1}
.h-stat .h-v small{font-size:15px;font-weight:700;color:var(--ink-3);margin-left:2px}
.h-stat .h-s{font-size:12px;color:var(--ink-3);margin-top:6px}
.h-delta svg{width:10px;height:10px;flex:none}
.h-delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;padding:3px 7px;border-radius:999px;background:var(--up-soft);color:var(--up)}
.h-stat.h-big{grid-column:1/-1}
.h-vol-head{display:flex;justify-content:space-between;align-items:flex-start}
.h-vol-v{font-size:44px;font-weight:800;line-height:1;margin-top:8px}
.h-vol-v small{font-size:18px;color:var(--ink-3);font-weight:700;margin-left:3px}
.h-fun{font-size:13px;color:var(--ink-2);margin-top:6px}
.h-bars{display:flex;align-items:flex-end;gap:10px;height:96px;margin-top:16px}
.h-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.h-bar i{display:block;width:100%;border-radius:8px;background:var(--s3);transform-origin:bottom;transform:scaleY(0);transition:transform .9s var(--ease)}
.h-bar.h-cur i{background:var(--grad)}
.h-bar.h-cur.h-partial i{background:repeating-linear-gradient(135deg,var(--red) 0 5px,var(--red-deep) 5px 10px)}
.h-bar span{font-size:11px;font-weight:600;color:var(--ink-3)}
.h-bar.h-cur span{color:var(--ink)}
.home.h-on .h-bar i{transform:scaleY(1)}

/* records */
.h-prs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.h-prs::-webkit-scrollbar{display:none}
.h-pr{flex:0 0 72%;scroll-snap-align:start;padding:16px;border-radius:var(--r-m);background:var(--s1);border:1px solid var(--line);box-shadow:var(--sh);position:relative;overflow:hidden}
.h-pr::before{content:"";position:absolute;inset:0;background:radial-gradient(80% 70% at 100% 0%,var(--pr-soft),transparent 70%)}
.h-pr>*{position:relative}
.h-pr-top{display:flex;justify-content:space-between;align-items:center}
.h-pr-tag{display:inline-flex;gap:5px;align-items:center;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--pr)}
.h-pr-tag svg{width:15px;height:15px}
.h-pr-d{font-size:12px;color:var(--ink-3)}
.h-pr-n{font-size:15px;font-weight:600;color:var(--ink-2);margin-top:12px}
.h-pr-v{font-size:32px;font-weight:800;margin-top:2px}
.h-pr-v small{font-size:15px;color:var(--ink-3);font-weight:700}
.h-pr-up{font-size:13px;font-weight:700;color:var(--up);margin-top:4px}

/* lifts */
.h-lifts{display:flex;flex-direction:column;gap:10px}
.h-lift{display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r-m);background:var(--s1);border:1px solid var(--line);box-shadow:var(--sh)}
.h-lift .h-n{font-size:15px;font-weight:700;letter-spacing:-.01em}
.h-lift .h-k{font-size:24px;font-weight:800;margin-top:4px}
.h-lift .h-k small{font-size:13px;color:var(--ink-3);font-weight:700;margin-left:2px}
.h-lift .h-sub{display:flex;gap:6px;align-items:center;margin-top:4px;font-size:12px;color:var(--ink-3)}
.h-lift>svg{width:120px;height:52px;overflow:visible}
.h-spark-path{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.2s var(--ease)}
.home.h-on .h-spark-path{stroke-dashoffset:0}

/* muscles */
.h-mus{display:flex;flex-direction:column;gap:12px}
.h-mu{display:grid;grid-template-columns:92px 1fr 46px;gap:10px;align-items:center;font-size:14px}
.h-mu .h-n{font-weight:600}
.h-mu .h-t{height:10px;border-radius:999px;background:var(--track);overflow:hidden}
.h-mu .h-t i{display:block;height:100%;border-radius:999px;transform-origin:left;transform:scaleX(0);transition:transform 1s var(--ease)}
.home.h-on .h-mu .h-t i{transform:scaleX(1)}
.h-mu .h-c{text-align:right;font-size:13px;color:var(--ink-3);font-weight:600}
.h-mu.h-done .h-c{color:var(--ink)}
.h-legend{display:flex;gap:14px;margin-top:14px;font-size:12px;color:var(--ink-3)}
.h-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* body weight */
.h-bw-head{display:flex;justify-content:space-between;align-items:flex-end}
.h-bw-v{font-size:40px;font-weight:800;line-height:1}
.h-bw-v small{font-size:17px;color:var(--ink-3);font-weight:700;margin-left:2px}
.h-bw>svg{width:100%;height:110px;margin-top:14px;overflow:visible}
.h-bw-note{font-size:13px;color:var(--ink-2);margin-top:10px}
.h-bw-note b{color:var(--ink)}

/* entrance */
.h-rise{opacity:0;transform:translateY(14px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.home.h-on .h-rise{opacity:1;transform:none}
  /* illustrations */
  .a-floor{stroke:var(--art-metal);stroke-width:3;stroke-linecap:round;fill:none;opacity:.55}
  .a-frame{stroke:var(--art-frame);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .a-thin{stroke:var(--art-metal);stroke-width:2.6;stroke-linecap:round;fill:none}
  .a-pad{stroke:var(--art-pad);stroke-width:12;stroke-linecap:round;fill:none}
  .a-plate{fill:var(--art-metal)}
  .a-stack{fill:var(--art-pad);stroke:var(--art-frame);stroke-width:2.5}
  .a-stackline{stroke:var(--art-frame);stroke-width:2;stroke-linecap:round;fill:none}
  .a-torso{stroke:var(--art-ink);stroke-width:12;stroke-linecap:round;fill:none}
  .a-limb{stroke:var(--art-ink);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .a-head{fill:var(--art-ink)}
  .a-padm{stroke:var(--art-pad);stroke-width:8;stroke-linecap:round;fill:none}
  .a-cable{stroke:var(--art-metal);stroke-width:1.8;fill:none}
  .a-grip{fill:var(--art-metal)}
  .a-roll{fill:var(--art-pad);stroke:var(--art-frame);stroke-width:2}
  .a-bar{stroke:var(--art-metal);stroke-width:4;stroke-linecap:round}
  :root{--fig:#2B2B33;--fig2:#9A9AA6}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fig:#ECEBE6;--fig2:#7C7C88}}
  :root[data-theme="dark"]{--fig:#ECEBE6;--fig2:#7C7C88}
  .a-arw{stroke:var(--hot);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
  /* questionnaire d'accueil */
  body.onb-open{overflow:hidden}
  body.onb-open .tabbar,body.onb-open .timer{display:none}
  .onb{position:fixed;inset:0;z-index:80;background:#0A0A0C;color:#F5F5F7;display:flex;flex-direction:column;overflow-y:auto;
    background-image:radial-gradient(120% 60% at 50% -10%,rgba(232,19,43,.28),transparent 60%);
    padding:calc(var(--sat) + 10px) 20px calc(var(--sab) + 16px);color-scheme:dark}
  .onb-top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:10px;min-height:44px}
  .onb-back{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#F5F5F7;font-size:24px;line-height:1}
  .onb-bar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
  .onb-bar i{display:block;height:100%;background:linear-gradient(90deg,#FF4757,#E8132B);border-radius:9px;transition:width .4s var(--ease)}
  .onb-body{flex:1;max-width:520px;width:100%;margin:0 auto;padding-top:18px;animation:onbIn .38s var(--ease)}
  .onb-body.back{animation-name:onbBack}
  @keyframes onbIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
  @keyframes onbBack{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
  .onb h2{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:8px 0 6px}
  .onb-sub{color:#A9A9B3;font-size:15.5px;margin:0 0 22px}
  .onb-foot{max-width:520px;width:100%;margin:16px auto 0;display:grid;gap:10px}
  .onb .btn.hot:disabled{opacity:.35;box-shadow:none}
  .onb-hero{text-align:center;padding-top:6vh}
  .onb-logo{width:96px;height:96px;border-radius:24px;box-shadow:0 18px 50px rgba(232,19,43,.35)}
  .onb-kick{font-size:12px;font-weight:800;letter-spacing:.22em;color:#FF4757;margin-top:18px}
  .onb-hero h1,.onb-ready h1{font-size:38px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:8px 0 12px}
  .onb-hero p{color:#B4B4BC;font-size:16px;max-width:400px;margin:0 auto}
  .onb-pts{list-style:none;padding:0;margin:26px auto 0;text-align:left;max-width:380px;display:grid;gap:10px}
  .onb-pts li{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:12px 14px;font-size:14.5px;color:#B4B4BC}
  .onb-pts b{color:#F5F5F7}
  .onb-link{display:block;text-align:center;color:#A9A9B3;font-size:14px;padding:10px;text-decoration:underline;cursor:pointer}
  .onb-in{width:100%;font:inherit;font-size:24px;font-weight:700;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#F5F5F7;border-radius:18px;padding:18px;outline:none}
  .onb-in:focus{border-color:#FF4757}
  .onb-picks{display:grid;gap:12px}
  .onb-pick{display:flex;align-items:center;gap:16px;text-align:left;width:100%;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.05);color:#F5F5F7;border-radius:22px;padding:18px;font:inherit;transition:transform .15s,background .2s,border-color .2s}
  .onb-pick:active{transform:scale(.98)}
  .onb-pick .ic{font-size:30px;width:54px;height:54px;flex:none;display:grid;place-items:center;border-radius:16px;background:rgba(255,255,255,.07)}
  .onb-pick b{display:block;font-size:18px;letter-spacing:-.01em}
  .onb-pick small{display:block;color:#A9A9B3;font-size:14px;margin-top:2px}
  .onb-pick.on,.onb-chip.on,.onb-days button.on,.onb-seg button.on{background:rgba(232,19,43,.16);border-color:#FF4757}

  .onb-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .onb-grid.four{grid-template-columns:repeat(4,1fr)}
  .onb-chip{border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.05);color:#F5F5F7;border-radius:16px;min-height:56px;padding:10px 12px;font:inherit;font-weight:650;font-size:15.5px}
  .onb-chip.wide{grid-column:1/-1}
  .onb-note{color:#8A8A94;font-size:13.5px;margin-top:16px}
  .onb-h4{font-size:15px;font-weight:700;margin:26px 0 10px;color:#B4B4BC}
  .onb-seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .onb-seg button{min-height:58px;border-radius:16px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.05);color:#F5F5F7;font:inherit;font-weight:700;font-size:17px}
  .onb-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .onb-fields label{font-size:13px;color:#A9A9B3;font-weight:600}
  .onb-fields span{display:flex;align-items:baseline;gap:4px;margin-top:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px}

  .onb-fields i{font-style:normal;color:#8A8A94;font-size:13px}
  .onb-days{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .onb-days button{position:relative;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.05);color:#F5F5F7;border-radius:20px;padding:16px 4px 14px;font:inherit}
  .onb-days b{display:block;font-size:34px;font-weight:800;line-height:1}
  .onb-days small{display:block;font-size:12px;color:#A9A9B3;margin-top:6px}
  .onb-days em{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10.5px;font-weight:800;background:#FF4757;color:#fff;border-radius:9px;padding:2px 7px;white-space:nowrap}
  .onb-deck{position:relative;height:min(58vh,400px);margin-top:6px}
  .onb-card{position:absolute;inset:0;border-radius:28px;padding:28px 24px;display:flex;flex-direction:column;justify-content:center;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;
    background:linear-gradient(160deg,#1E1E24,#121215);border:1px solid rgba(255,255,255,.09);box-shadow:0 24px 60px rgba(0,0,0,.55)}
  .onb-card.under{transform:scale(.94) translateY(16px);opacity:.6}
  .onb-card.top{cursor:grab}
  .onb-card .ic{font-size:64px;margin-bottom:18px}
  .onb-card h3{font-size:26px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin:0 0 12px;color:#F5F5F7;text-transform:none}
  .onb-card p{color:#A9A9B3;font-size:15.5px;margin:0}
  .onb-card .stamp{position:absolute;top:22px;font-size:22px;font-weight:900;letter-spacing:.1em;border:3px solid;border-radius:12px;padding:4px 12px;opacity:0;pointer-events:none}
  .onb-card .stamp.yes{left:22px;color:#32D74B;transform:rotate(-12deg)}
  .onb-card .stamp.no{right:22px;color:#FF4757;transform:rotate(12deg)}
  .onb-count{text-align:center;color:#8A8A94;font-size:13px;margin:16px 0 8px;font-weight:600}
  .onb-swbtn{display:flex;justify-content:center;align-items:center;gap:18px}
  .onb-swbtn button{width:68px;height:68px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#FF4757;font-size:26px;font-weight:800}

  .onb-swbtn button.mid{width:auto;height:44px;border-radius:22px;padding:0 16px;font-size:14px;color:#B4B4BC;font-weight:600}

  .onb-tags{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
  .onb-tags span{background:rgba(255,255,255,.07);border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:650}
  .onb-split{color:#A9A9B3;font-size:14.5px;margin:0 0 12px}
  .onb-sess{display:grid;gap:8px}
  .onb-sess>div{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:12px 14px}
  .onb-sess b{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#FF4757,#9E0B1E);font-weight:800}
  .onb-sess strong{display:block;font-size:15.5px}
  .onb-sess small{display:block;color:#A9A9B3;font-size:13px;margin-top:2px}
  .onb-nut{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .onb-nut>div{background:rgba(255,255,255,.05);border-radius:18px;padding:12px 14px}
  .onb-nut small{display:block;color:#8A8A94;font-size:12px;font-weight:600}
  .onb-nut b{display:block;font-size:22px;font-weight:800;margin-top:2px}
  .onb-nut span{color:#A9A9B3;font-size:12.5px}
  .onb-card .body{width:118px;height:196px;margin:0 auto 10px;display:block}
  .bz{fill:rgba(255,255,255,.13)}
  .bz.on{fill:url(#bzg);filter:drop-shadow(0 0 6px rgba(232,19,43,.7))}
  .bzt{fill:#8A8A94;font-size:9px;font-weight:600}
  .onb-deck.zones .onb-card{padding:20px 24px}
  .onb-swbtn.txt button:first-child,.onb-deck.zones .stamp.no{color:#FFB224}
  .onb-swbtn.txt button{width:auto;height:52px;border-radius:26px;padding:0 16px;font-size:14.5px;font-weight:700}
  .onb-fields.one{grid-template-columns:1fr;gap:12px}
  .onb-fields.one label{font-size:15px;color:#F5F5F7}
  .onb-fields.one small{display:block;color:#8A8A94;font-size:12.5px;font-weight:500;margin-top:2px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chipb{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:99px;min-height:40px;padding:0 14px;font:inherit;font-size:14.5px;font-weight:600}
  .chipb.on{background:var(--hot-soft);border-color:var(--hot);color:var(--ink)}
  .mphoto{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;margin:6px 0 10px;background:#0A0A0C}
  .onb-ok{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-size:13.5px;color:#B4B4BC;line-height:1.45}
  .onb-ok input{width:22px;height:22px;flex:none;accent-color:#E8132B;margin-top:1px}
  @media (prefers-reduced-motion: reduce){.onb-body{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top">
    <h1 id="ttl">Aujourd'hui</h1>
    <button class="chip" id="bwchip" aria-label="Mon poids"></button>
    <button class="icon-btn" id="themeBtn" aria-label="Changer de thème"></button>
  </header>
  <main id="view"></main>
  <div class="foot" id="foot"></div>
</div>

<nav class="tabbar" id="tabbar" role="tablist">
  <button role="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg>Accueil</button>
  <button role="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Séance</button>
  <button role="tab" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Programme</button>
  <button role="tab" data-tab="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>Progrès</button>
  <button role="tab" data-tab="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4.5h10a4 4 0 0 1 4 4v11H9a4 4 0 0 1-4-4z"/><path d="M9 9h6M9 13h4"/></svg>Guide</button>
</nav>

<div class="timer hidden" id="timer" role="timer" aria-live="polite">
  <div class="ring"><svg viewBox="0 0 52 52"><circle class="bgc" cx="26" cy="26" r="22"/><circle class="fg" id="tring" cx="26" cy="26" r="22" stroke-dasharray="138.2" stroke-dashoffset="0"/></svg></div>
  <button class="tx" id="tbox" aria-label="Changer la durée du repos"><b id="tdisp">0:00</b><small id="tlabel">Repos</small></button>
  <button class="tb" id="tminus">−15</button><button class="tb" id="tplus">+15</button><button class="tb x" id="tstop">Passer</button>
</div>
<div class="toast hidden" id="toast" role="status"></div>
<div class="sheet-bg hidden" id="sheetbg"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true"></div>

/* ===================== ANIMATIONS DES EXERCICES =====================
   Un personnage vu de profil (tourné vers la droite) fait le mouvement en boucle.
   Chaque pose : position de la hanche (hp), angle du buste (t), bras et jambes
   (angles, ou point à atteindre : wt = main, at = cheville). Angles : 0 = vers le bas,
   90 = vers l'avant (droite), 180 = vers le haut, -90 = vers l'arrière.
   Le muscle travaillé est en rouge.                                                    */

  if(d>mx){const k=mx/d;return [ad(r,[dx*k*l1/mx,dy*k*l1/mx]),ad(r,[dx*k,dy*k])];}
  d=Math.max(d,Math.abs(l1-l2)+0.01);const b=Math.atan2(dy,dx),a=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))))*s;
  return [[r[0]+l1*Math.cos(b+a),r[1]+l1*Math.sin(b+a)],tg];}
function limb(root,p,ka,kb,kt,l1,l2,bend){
  if(p[kt])return ik(root,p[kt],l1,l2,bend);
  const j=ad(root,dv(p[ka]??0,l1));return [j,ad(j,dv(p[kb]??0,l2))];}

  const hp=p.hp,S=ad(hp,dv(p.t,AL.tr)),N=ad(S,dv(p.t,AL.nk*0.6)),Hd=ad(S,dv(p.t+(p.hd||0),AL.nk+7));
  const [E,W]=limb(S,p,"ua","fa","wt",AL.ua,AL.fa,p.eb??1);
  const p2={ua:p.ua2??p.ua,fa:p.fa2??p.fa,wt:p.wt2??p.wt};const [E2,W2]=limb(S,p2,"ua","fa","wt",AL.ua,AL.fa,p.eb??1);
  const [K,A]=limb(hp,p,"th","sh","at",AL.th,AL.sh,p.kb??-1);
  const q2={th:p.th2??p.th,sh:p.sh2??p.sh,at:p.at2??p.at};const [K2,A2]=limb(hp,q2,"th","sh","at",AL.th,AL.sh,p.kb2??p.kb??-1);
  const T=ad(A,dv(p.ft??90,AL.ft)),T2=ad(A2,dv(p.ft2??p.ft??90,AL.ft));

function envTokens(p){
  if(p.place==="salle")return ["salle","rien","halteres","banc","barre"];
  if(p.place==="maison")return ["rien","maison"].concat(p.equip||[]);
  return ["rien","dehors"].concat(p.bars==="oui"?["barre","dips","barrebasse"]:[]);
}
/* les candidats d'un rôle, du meilleur au moins bon pour cette personne */
function candidates(pat,p){
  const tk=envTokens(p),pain=p.pain||[],lvl=p.level||0,sw=p.swipe||{};
  const ok=LIB.filter(e=>e.pat===pat&&e.on.some(t=>tk.includes(t))&&!(e.not||[]).some(x=>tk.includes(x))&&!(e.avoid||[]).some(x=>pain.includes(x))&&(e.lvl||0)<=Math.max(lvl,0));
  const score=e=>{let s=0;
    if(p.place==="salle"){if(e.bw&&e.pat!=="core")s-=6;if(e.on.includes("salle"))s+=2;
      if(sw.mach===true||sw.peur===true||lvl===0)s+=e.mach?2:0;if(sw.mach===false)s+=e.mach?-1:1.5;}
    else{if(e.unit==="haltere")s+=3;if(e.unit==="elastique")s+=1;if(BWU(e)&&e.unit!=="elastique")s+=1.5;}
    if(lvl===0||sw.peur===true)s+=e.easy?1.5:0;
    if(lvl>=1&&e.lvl===1)s+=1;
    if(pat==="core"&&pain.includes("dos"))s+=e.uid==="deadBug"?3:0;
    return s;};
  let r=ok.map((e,i)=>({e,s:score(e)-i*0.01})).sort((a,b)=>b.s-a.s).map(x=>x.e);
  if(p.place==="salle"&&pat!=="core"&&r.some(e=>!e.bw))r=r.filter(e=>!e.bw);
  return r;
}

function generate(p){
  const split=SPLITS[pickSplit(p)],dur=+p.dur||45,sw=p.swipe||{},lvl=p.level||0,goal=p.goal||"forme";
  const nEx=dur<=30?4:dur<=45?5:dur<=60?6:7;
  const fpats=[].concat(...(p.focus||[]).map(f=>FOCUSPAT[f]||[]));
  const spats=[].concat(...(p.strong||[]).filter(z=>!(p.focus||[]).includes(z)).map(f=>FOCUSPAT[f]||[]));
  const fBase=[0.75,1,1.35,1.6][lvl]*Math.min(1.25,Math.max(0.8,Math.sqrt((+p.weight||70)/75)));

  const L=p.loads||{},fam=e=>LOWER.includes(e.pat)?"legPress":["vpull","hpull","rear","bic"].includes(e.pat)?"latPulldown":"benchPlate";

    roles=roles.filter(r=>!(r.endsWith("2")&&spats.includes(r.replace(/2$/,""))));

      if(!e)continue;seen.add(e.uid);chosen.push(e);}
    /* abdos à chaque séance : on garde le gainage en dernier même si la séance est courte */
    /* trop peu d'exercices possibles (peu de matériel) : on complète avec ce qui existe */
    for(const r of ["quad","glute","hpush","rear","hinge","core","abd","calf","ham"]){if(chosen.length>=Math.min(nEx,4))break;
      const x=candidates(r,p).find(y=>!seen.has(y.uid));if(x){seen.add(x.uid);chosen.push(x);}}
    if(wantCore&&!chosen.some(e=>e.pat==="core")){const c=candidates("core",p).find(x=>!seen.has(x.uid));if(c){chosen.pop();chosen.push(c);}}

      const comp=!!e.comp,bw=BWU(e);

      else if(goal==="muscle"){min=comp?(sw.lourd===true?6:8):10;max=comp?(sw.lourd===true?10:12):15;rest=comp?150:75;}
      else if(goal==="gras"){min=comp?10:12;max=comp?12:15;rest=comp?90:60;}

        warm:comp&&!bw&&j<2&&p.place==="salle",alt:e.alt&&p.gym==="onair"?e.alt:(alts.length?alts:[{nom:"Demande à l'accueil une machine qui travaille le même muscle"}])});
    });

    const min=Math.round(exos.reduce((a,e)=>a+e.series*(40+e.rest),0)/60)+8;

  const allEx=[].concat(...keys.map(k=>PP[k].exos));
  const bwShare=allEx.filter(BWU).length/Math.max(1,allEx.length);
  const liftU=[];keys.forEach(k=>{const e=PP[k].exos.find(x=>x.comp)||PP[k].exos[0];if(e&&!liftU.includes(e.uid))liftU.push(e.uid);});
  allEx.forEach(e=>{if(liftU.length<3&&e.comp&&!liftU.includes(e.uid))liftU.push(e.uid);});
  return {P:PP,KEYS:keys,PLAN:PLANG,split:split.nom,reps:bwShare>0.5,lifts:liftU.slice(0,3)};
}

function nutrition(p){
  const w=+p.weight||70,h=+p.height||170,a=+p.age||25,f=p.sex==="F";
  const bmr=10*w+6.25*h-5*a+(f?-161:5),tdee=bmr*(1.3+0.06*(+p.days||3));

}

function migrate(s){
  const v=s&&s.v;
  s=Object.assign(BLANK(),s||{});
  if(!v){ /* v1 : clés « A:a1 » et une seule série par jour */
    const nl={};
    Object.keys(s.log||{}).forEach(key=>{
      const[k,id]=key.split(":");const map={a1:"chestIncline",a2:"latPulldown",a3:"smithBench",a4:"shoulderPress",a5:"cableLatRaise",a6:"triPushdown",
        b1:"legPress",b2:"legCurl",b3:"legExt",b4:"adductor",b5:"calfPress",b6:"plank",c1:"seatedRow",c2:"latPulldownV",c3:"pecDeck",c4:"cableLatRaise",
        c5:"rearDelt",c6:"preacherCurl",d1:"preacherCurl",d2:"machineCurl",d3:"triPushdown",d4:"overheadTri",d5:"cableLatRaise",d6:"rearDelt",d7:"plank"};
      const u=map[id]||key;
      (s.log[key]||[]).forEach(x=>{const sets=x.sets||[{kg:x.kg,reps:x.reps}];nl[u]=nl[u]||[];
        const ex=nl[u].find(y=>y.d===x.d);if(ex)ex.sets=ex.sets.concat(sets);else nl[u].push({d:x.d,sets});});
    });
    s.log=nl;
    Object.entries(s.done||{}).forEach(([k,d])=>{if(!s.hist.some(h=>h.d===d&&h.k===k))s.hist.push({d,k});});
    delete s.done;
  }
  /* nettoyage : entrées sans série valide (corrige le bug des séries vides) */
  Object.keys(s.log).forEach(u=>{s.log[u]=(s.log[u]||[]).filter(x=>W(x).length||(x.warm||[]).some(Boolean)).sort((a,b)=>a.d<b.d?-1:1);if(!s.log[u].length)delete s.log[u];});
  s.v=3;
  if(!s.profile&&(Object.keys(s.log).length||s.hist.length))s.profile={mode:"nils"};
  if(!s.start){const ds=[].concat(...Object.values(s.log).map(a=>a.map(x=>x.d)),s.hist.map(h=>h.d)).sort();s.start=ds[0]||today();}
  return s;
}

function cycleInfo(){const w=Math.max(0,Math.floor(daysBetween(weekStart(store.start),weekStart(today()))/7));return {cycle:Math.floor(w/6)+1,wk:w%6+1,deload:w%6===5};}

const todayEntry=u=>H(u).find(x=>x.d===today());
const pastEntries=u=>H(u).filter(x=>x.d!==today()&&W(x).length);

function workKg(S){const c={};S.forEach(s=>{c[s.kg]=(c[s.kg]||0)+1;});let k=null,m=0;Object.keys(c).forEach(x=>{const v=+x;if(c[x]>m||(c[x]===m&&v>k)){k=v;m=c[x];}});return k??0;}
const FEEL={facile:"Facile",dur:"Dur",echec:"À l'échec"};
function plan(e){
  const n=seriesFor(e),past=pastEntries(e.uid).filter(x=>!x.dl),last=past[past.length-1],prev=past[past.length-2],dl=cycleInfo().deload;
  const out={kg:e.kg0,reps:Array(n).fill(e.min),msg:null,cls:""};
  if(!last&&BWU(e)){out.msg=`Première fois : vise <b>${e.min} à ${e.max} ${e.unit==="sec"?"secondes":"répétitions"}</b> propres par série.${e.easier?` Trop dur ? Prends la version facile : ${e.easier}.`:""}`;out.cls="info";return out;}
  if(!last){out.msg=`Première fois : commence à <b>${fmt(e.kg0)} kg${sideTxt(e,e.kg0)}</b> et cherche une charge où tu fais au moins ${e.min} répétitions propres. Trop facile ? Monte à la série suivante.`;out.cls="info";return out;}
  const S=W(last),wk=workKg(S.slice(0,n)),need=Math.min(n,last.n||n),SS=S.slice(0,need),feel=last.feel||"dur";
  const tot=x=>W(x).slice(0,n).reduce((a,s)=>a+s.reps,0),under=x=>W(x).slice(0,n).some(s=>s.reps<e.min);
  const top=SS.length>=need&&SS.every(s=>s.reps>=e.max&&s.kg>=wk);
  out.kg=wk;
  if(!BWU(e)&&daysBetween(last.d,today())>=14){out.kg=roundTo(Math.max(e.inc,wk*0.9),e.inc);out.reps=Array(n).fill(e.min);
    out.msg=`Retour après ${Math.round(daysBetween(last.d,today())/7)} semaines : <b>${fmt(out.kg)} kg</b>, environ 10 % plus léger, pour reprendre en douceur. Tes charges reviendront vite.`;out.cls="info";return out;}
  if(dl){out.reps=Array.from({length:n},(_,j)=>Math.max(e.min,((S[j]||S[S.length-1]).reps)-3));
    out.msg="<b>Semaine légère</b> : même charge, moitié des séries, 3 répétitions en réserve.";out.cls="info";return out;}
  if(BWU(e)){const st=e.unit==="sec"?5:1,add=(feel==="facile"?2:feel==="echec"?0:1)*st;
    if(top&&feel!=="echec"){out.reps=Array(n).fill(e.max);out.msg=`Haut de la fourchette partout : bravo ! ${e.next?`Passe à <b>${e.next}</b>, ou`:"Tu peux"} ralentir la descente (3 secondes) pour rendre l'exercice plus dur.`;return out;}
    if(past.length>=2&&under(last)&&under(prev)){out.reps=Array(n).fill(e.min);out.msg=`Deux séances sous ${e.min} : ${e.easier?`prends la version plus facile (<b>${e.easier}</b>) et`:""} refais le plein de répétitions.`;out.cls="down";return out;}
    out.reps=Array.from({length:n},(_,j)=>Math.min(e.max,(S[j]||S[S.length-1]).reps+add));
    out.msg=add===0?`C'était à l'échec : <b>mêmes ${e.unit==="sec"?"secondes":"répétitions"}</b>, sans y aller cette fois.`:`Vise <b>${add===st?(e.unit==="sec"?"5 secondes":"une répétition"):(e.unit==="sec"?"10 secondes":"deux répétitions")} de plus</b> par série : ${out.reps.join(" · ")}.`;return out;}
  if(feel==="echec"&&prev&&prev.feel==="echec"&&tot(last)<=tot(prev)){
    out.kg=roundTo(Math.max(0,wk-e.inc),e.inc/2);out.reps=Array(n).fill(Math.max(e.min,e.max-2));
    out.msg=`Deux fois à l'échec sans progrès : <b>redescends à ${fmt(out.kg)} kg</b> et reconstruis proprement.`;out.cls="down";return out;}
  if(top){
    if(feel==="echec"){out.reps=Array.from({length:n},(_,j)=>Math.min(e.max,(S[j]||S[S.length-1]).reps));
      out.msg="Haut de la fourchette, mais à l'échec : <b>consolide</b>. Même charge, mêmes répétitions, sans aller à l'échec. Quand ce sera « Dur », tu monteras.";out.cls="info";return out;}
    const steps=feel==="facile"&&2*e.inc<=0.1*wk?2:1;out.kg=wk+steps*e.inc;
    out.reps=Array(n).fill(feel==="facile"?Math.min(e.max,e.min+2):e.min);
    out.msg=`${feel==="facile"?"C'était facile":"Haut de la fourchette partout"} : <b>monte à ${fmt(out.kg)} kg</b>${sideTxt(e,out.kg)} et vise ${out.reps[0]} répétitions.`;return out;}
  if(past.length>=2&&under(last)&&under(prev)){
    out.kg=roundTo(Math.max(0,wk-e.inc),e.inc/2);out.reps=Array(n).fill(e.max);
    out.msg=`Deux séances sous ${e.min} répétitions : <b>redescends à ${fmt(out.kg)} kg</b> et refais le plein de répétitions.`;out.cls="down";return out;}
  if(feel==="facile"&&prev&&prev.feel==="facile"&&workKg(W(prev).slice(0,n))===wk){
    out.kg=wk+e.inc;out.reps=Array(n).fill(e.min);
    out.msg=`Deux fois « facile » à cette charge : elle est trop légère, <b>monte à ${fmt(out.kg)} kg</b>.`;return out;}
  const add=feel==="facile"?2:feel==="echec"?0:1;
  out.reps=Array.from({length:n},(_,j)=>Math.min(e.max,(S[j]||S[S.length-1]).reps+add));
  const l3=past.slice(-3);
  if(l3.length===3&&l3.every(x=>workKg(W(x).slice(0,n))===wk)&&tot(l3[2])<=tot(l3[0])){
    out.msg="Pas de progrès depuis 3 séances : dors bien, mange assez. Si ça dure, fais cette séance 10 % plus léger, puis remonte.";out.cls="down";return out;}
  out.msg=add===0?`C'était à l'échec : <b>mêmes répétitions</b>, sans y aller cette fois : ${out.reps.join(" · ")}.`
    :`Même charge, <b>${add===2?"deux répétitions":"une répétition"} de plus</b> par série : ${out.reps.join(" · ")}.`;
  return out;
}
const warmups=(e,kg)=>e.warm&&!BWU(e)&&kg>0&&!cycleInfo().deload?[{kg:roundTo(kg*.5,e.inc),reps:10},{kg:roundTo(kg*.75,e.inc),reps:5}]:[];

/* ===================== NAVIGATION ===================== */
let tab="home",sess=null;const expanded={};
const view=$("view");
function defaultSession(){
  const t=today();
  for(const k of KEYS)if(P[k].exos.some(e=>{const te=todayEntry(e.uid);return te&&W(te).length;})&&!store.hist.some(h=>h.k===k&&h.d===t))return k;
  const ws=weekStart(t),done=new Set(store.hist.filter(h=>h.d>=ws).map(h=>h.k));
  const dow=(new Date().getDay()+6)%7;
  if(BONUS&&dow===6&&!done.has(BONUS))return BONUS;
  return MAIN.find(k=>!done.has(k))||BONUS||MAIN[0];
}
function go(t,k){tab=t;if(k)sess=k;$("toast").classList.add("hidden");try{localStorage.setItem(KEY+"-tab",t);}catch(e){}render();}
function render(keep){
  const y=window.scrollY;
  document.querySelectorAll("#tabbar button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab?"true":"false"));
  chip();
  $("top").classList.toggle("hidden",tab==="home");document.body.classList.toggle("on-home",tab==="home");
  if(tab==="home")vHome();else if(tab==="today")vSession(sess);else if(tab==="plan")vPlan();else if(tab==="prog")vProg();else vGuide();
  window.scrollTo(0,keep?y:0);
}
function chip(){const b=store.bw[store.bw.length-1];$("bwchip").innerHTML=b?`<b class="num">${fmt(b.kg)}</b> kg`:"+ Mon poids";}

/* ===================== SÉANCE ===================== */
function sessionStats(k){let done=0,tot=0;
  P[k].exos.forEach(e=>{if(e.opt)return;const n=seriesFor(e);tot+=n;done+=Math.min(W(todayEntry(e.uid)).length,n);});return {done,tot};}
const isFull=e=>W(todayEntry(e.uid)).length>=seriesFor(e);
function activeIdx(k){const ex=P[k].exos;const i=ex.findIndex(e=>!isFull(e)&&!e.opt);return i<0?ex.findIndex(e=>!isFull(e)):i;}

function firstVisit(){

    ${PROG.place==="salle"?`<li><b>En arrivant :</b> pose tes affaires au vestiaire, prends ta serviette (obligatoire sur les machines) et ta gourde.</li>

    <li><b>Règle la machine</b> avant de commencer (siège, dossier) et note tes réglages dans l'app.</li>`:`<li><b>Prépare ton coin :</b> un tapis ou une serviette, une bouteille d'eau, de la place pour bouger les bras.</li>`}
    <li><b>Commence léger.</b> La première séance sert à apprendre les mouvements. Personne ne te regarde, et tout le monde a commencé un jour.</li>
    <li><b>Valide chaque série</b> avec le ✓ : le chrono de repos se lance tout seul.</li>
    <li><b>Douleur vive, pas une simple brûlure musculaire ?</b> Arrête l'exercice.</li></ul></details>`;
}
function vSession(k){
  $("ttl").textContent=LABEL[k];
  const s=P[k],t=today(),fini=store.hist.some(h=>h.k===k&&h.d===t),ws=weekStart(t);

  view.innerHTML=`
  <div class="seg" role="tablist" style="grid-template-columns:repeat(${KEYS.length},1fr)">${KEYS.map(x=>`<button role="tab" data-s="${x}" aria-selected="${x===k}">${x===BONUS?"Bonus":x}${doneW.has(x)?'<span class="ck">✓</span>':""}</button>`).join("")}</div>
  <div class="big-title">${s.nom}</div>
  <p class="musc">${s.muscles}</p>

  ${ci.deload?`<div class="banner"><b>Semaine légère (semaine 6 du cycle).</b> Mêmes charges, moitié des séries, 3 répétitions en réserve. Ton corps encaisse les progrès des 5 dernières semaines.</div>`:""}
  ${!store.hist.length&&!PROG.nils?firstVisit():""}
  ${k!==BONUS?`<div class="banner info small">${PROG.place==="salle"?"Échauffement : 5 min de vélo ou de rameur, puis les séries <b>É</b> proposées sur les premiers exercices (elles ne comptent pas dans tes progrès).":"Échauffement : 5 min pour monter en température (marche rapide, montées de genoux, cercles de bras), puis une première série facile de chaque exercice."}</div>`:""}
  <div class="sprog">${fini?`<div class="row"><span style="color:var(--go)"><b style="color:var(--go)">✓ Séance terminée</b> · ${st.done}/${st.tot} séries</span></div>`:`<div class="row"><span>Exo <b>${Math.min(ai<0?s.exos.length:ai+1,s.exos.length)}/${s.exos.length}</b> · <b id="pdone">${st.done}</b>/${st.tot} séries</span>
    <span class="dots">${s.exos.map((e,i)=>`<button data-jump="${e.id}" class="${isFull(e)?"ok":i===ai?"on":""}" aria-label="${esc(e.nom)}">${i+1}</button>`).join("")}</span></div>
    <div class="bar"><i id="pbar" style="width:${st.tot?st.done/st.tot*100:0}%"></i></div>`}</div>
  ${s.exos.map((e,i)=>`<div class="exo ${isFull(e)?"full":""} ${i===ai?"active":""}" id="c-${e.id}">${card(k,e,i)}</div>`).join("")}
  <div id="finish">${fini?`<div class="panel" style="text-align:center"><b style="color:var(--go)">✓ Séance enregistrée aujourd'hui</b><p class="small muted" style="margin-top:6px">Tu peux encore corriger une série si besoin.</p></div>`
    :`<button class="btn hot wide" id="fin">Terminer la séance</button>`}</div>`;
  view.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sess=b.dataset.s;render();});
  view.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{const e=s.exos.find(x=>x.id===b.dataset.jump);expanded[e.uid]=true;refreshCard(k,e);$("c-"+e.id).scrollIntoView({behavior:"smooth",block:"start"});});
  s.exos.forEach(e=>wire(k,e));
  const f=$("fin");if(f)f.onclick=()=>finish(k);
}

function card(k,e,i){
  const te=todayEntry(e.uid),n=seriesFor(e),sets=(te&&te.sets)||[],doneN=W(te).length;
  if(doneN>=n&&te.feel&&!expanded[e.uid]){
    const S=W(te);return `<button class="collapsed" data-open="1"><span class="c">✓</span><span class="t">${esc(e.nom)}</span><span class="s num">${S.length} × ${fmt(workKg(S))} kg${te.feel?" · "+FEEL[te.feel]:""}</span></button>`;}
  const pl=plan(e),past=pastEntries(e.uid),last=past[past.length-1];
  const firstKg=num(sets[0]&&sets[0].kg)??pl.kg;
  const wu=warmups(e,pl.kg),wl=(te&&te.warm)||[];
  const pb=past.length?Math.max(...past.map(best)):null;
  const rows=[];
  wu.forEach((w,j)=>{const d=wl[j];rows.push(`<div class="set warm ${d?"done":""}" data-w="${j}"><span class="n">É${j+1}</span>
    <input type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-label="Charge échauffement ${j+1}" value="${fmt(d?d.kg:w.kg)}">
    <input type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done" aria-label="Répétitions échauffement ${j+1}" value="${d?d.reps:w.reps}">
    <button class="ok" aria-label="Valider l'échauffement ${j+1}">${I_OK}</button></div>`);});
  for(let j=0;j<n;j++){const d=sets[j];
    const kgV=d?d.kg:pl.kg,rpV=d?d.reps:pl.reps[j];
    rows.push(`<div class="set ${d?"done":""}" data-j="${j}"><span class="n">${j+1}</span>
      <input class="${d?"":"sug"}" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" aria-label="Charge série ${j+1}" placeholder="kg" value="${kgV==null?"":fmt(kgV)}">
      <input class="${d?"":"sug"}" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done" aria-label="Répétitions série ${j+1}" placeholder="reps" value="${rpV==null?"":rpV}">
      <button class="ok" aria-label="Valider la série ${j+1}">${I_OK}</button>
      ${d&&pb!=null&&d.kg>pb?`<span class="pr">🏆 Record : ${fmt(d.kg)} kg</span>`:""}</div>`);}
  const note=store.notes[e.uid];
  return `<div class="exo-hd">
      <button class="thumb" data-info="1" aria-label="Voir la machine et les consignes">${picHTML(e)}<span class="n">${doneN>=n?"✓":i+1}</span>${photoOf(e)?"":`<span class="cam">${I_CAM}</span>`}</button>
      <div class="exo-ti"><h4>${esc(e.nom)}</h4>
        <div class="meta"><b>${n} × ${repsTxt(e)}</b> · repos <b>${mmss(restFor(e))}</b></div>
        <span class="tag ${e.opt?"opt":""}">${e.opt?"Facultatif · ":""}${e.muscle}</span></div></div>
    <div class="reg" data-reg="1">${note?`<button data-edit="1">⚙︎ Réglages : <b>${esc(note)}</b></button>`:`<button data-edit="1">⚙︎ Noter mes réglages (siège, dossier, cran…)</button>`}</div>
    ${pl.msg&&doneN<n?`<div class="tip ${pl.cls}">${pl.msg}</div>`:""}
    <div class="sets">
      <div class="sets-hd"><span>Série</span><span>${BWU(e)?"Lest":"kg"}</span><span>${e.unit==="sec"?"Sec.":"Reps"}</span><span></span></div>
      <div class="side">Gris = proposé, touche ✓ si tu l'as fait · Charge = ${UNIT[e.unit]}${e.unit==="disques"?" (sans le poids de la machine)":""}${e.unit==="sec"?" · Reps = secondes tenues":""}</div>
      ${rows.join("")}
      ${doneN>=n?`<div class="feel-q">C'était comment ? <span class="muted" style="font-weight:500">(touche encore pour décocher)</span></div><div class="feel">${[["facile","Facile, 3+ en réserve"],["dur","Dur, 1-2 en réserve"],["echec","À l'échec"]].map(([v,l])=>`<button data-feel="${v}" class="${te.feel===v?"on":""}">${l}</button>`).join("")}</div>`:""}
      <div class="prev">${last?`Dernière fois (${fr(last.d)}) : <b class="num">${W(last).map(s=>`${fmt(s.kg)}×${s.reps}`).join(" · ")}</b>`:`Départ conseillé : <b>${e.depart}</b>`}</div>
    </div>
    <div class="exo-ft"><button data-info="1">${PROG.place==="salle"?"Machine et consignes":"Comment faire"} ›</button>${doneN>=n?`<button data-close="1">Replier</button>`:""}</div>`;
}

function refreshCard(k,e){
  const el=$("c-"+e.id);if(!el)return;const i=P[k].exos.indexOf(e);el.innerHTML=card(k,e,i);
  el.classList.toggle("full",isFull(e));wire(k,e);
  const st=sessionStats(k),ai=activeIdx(k);if(!$("pdone"))return;$("pdone").textContent=st.done;$("pbar").style.width=(st.tot?st.done/st.tot*100:0)+"%";
  P[k].exos.forEach((x,j)=>{const c=$("c-"+x.id);if(c)c.classList.toggle("active",j===ai);
    const d=view.querySelector(`[data-jump="${x.id}"]`);if(d)d.className=isFull(x)?"ok":j===ai?"on":"";});
  const r=view.querySelector(".sprog .row span b");if(r)r.textContent=`${Math.min(ai<0?P[k].exos.length:ai+1,P[k].exos.length)}/${P[k].exos.length}`;
}
function entryFor(u){const L=store.log[u]=store.log[u]||[];let te=L.find(x=>x.d===today());
  if(!te){te={d:today(),sets:[]};L.push(te);L.sort((a,b)=>a.d<b.d?-1:1);}return te;}
function cleanEntry(u,te){while(te.sets.length&&!te.sets[te.sets.length-1])te.sets.pop();
  for(let q=0;q<te.sets.length;q++)if(!te.sets[q])te.sets[q]=null;
  if(!W(te).length&&!(te.warm||[]).some(Boolean)){store.log[u]=(store.log[u]||[]).filter(x=>x!==te);if(!store.log[u].length)delete store.log[u];}}

function wire(k,e){
  const box=$("c-"+e.id);if(!box)return;
  const o=box.querySelector("[data-open]");if(o){o.onclick=()=>{expanded[e.uid]=true;refreshCard(k,e);};return;}
  box.querySelectorAll("[data-info]").forEach(b=>b.onclick=()=>infoSheet(e,k));
  const cl=box.querySelector("[data-close]");if(cl)cl.onclick=()=>{expanded[e.uid]=false;refreshCard(k,e);};
  box.querySelector("[data-edit]").onclick=()=>{const r=box.querySelector("[data-reg]");
    r.innerHTML=`<input type="text" maxlength="80" placeholder="ex. siège 4, dossier 2" value="${esc(store.notes[e.uid]||"")}" enterkeyhint="done"><button class="btn line" style="min-height:40px">OK</button>`;
    const inp=r.querySelector("input");inp.focus();
    const save=()=>{const v=inp.value.trim();if(v)store.notes[e.uid]=v;else delete store.notes[e.uid];persist();refreshCard(k,e);};
    r.querySelector("button").onclick=save;inp.onkeydown=ev=>{if(ev.key==="Enter")save();};};
  box.querySelectorAll("[data-feel]").forEach(b=>b.onclick=()=>{const te=todayEntry(e.uid);if(!te)return;
    if(te.feel===b.dataset.feel){delete te.feel;persist();refreshCard(k,e);toast("Ressenti retiré");return;}
    te.feel=b.dataset.feel;persist();expanded[e.uid]=false;refreshCard(k,e);
    toast({facile:"Noté : facile. La prochaine fois, ça montera plus vite.",dur:"Noté : dur. Parfait, c'est la bonne zone.",echec:"Noté : à l'échec. La prochaine fois, on consolide."}[te.feel],"Annuler",()=>{const t2=todayEntry(e.uid);if(t2){delete t2.feel;persist();expanded[e.uid]=true;refreshCard(k,e);}});
    const ex=P[k].exos,nx=ex.slice(ex.indexOf(e)+1).find(x=>!isFull(x));if(nx)setTimeout(()=>$("c-"+nx.id).scrollIntoView({behavior:"smooth",block:"start"}),120);});
  box.querySelectorAll(".set").forEach(row=>{
    const [ik,ir]=row.querySelectorAll("input");
    [ik,ir].forEach(inp=>{inp.addEventListener("focus",()=>setTimeout(()=>inp.select(),0));inp.addEventListener("input",()=>inp.classList.remove("sug"));});
    if(row.dataset.j!=null)ik.addEventListener("input",()=>{let nx=row.nextElementSibling;
      while(nx&&nx.classList.contains("set")){if(!nx.classList.contains("done")&&nx.dataset.j!=null)nx.querySelector("input").value=ik.value;nx=nx.nextElementSibling;}});
    row.querySelector(".ok").onclick=()=>{
      const warm=row.dataset.w!=null,j=+(warm?row.dataset.w:row.dataset.j);
      const te=entryFor(e.uid);const arr=warm?(te.warm=te.warm||[]):te.sets;
      if(row.classList.contains("done")){const old=arr[j];arr[j]=null;cleanEntry(e.uid,te);persist();refreshCard(k,e);
        toast(`${warm?"Échauffement":"Série "+(j+1)} annulé${warm?"":"e"}`,"Rétablir",()=>{const t2=entryFor(e.uid);(warm?(t2.warm=t2.warm||[]):t2.sets)[j]=old;cleanEntry(e.uid,t2);persist();refreshCard(k,e);});return;}
      const kg=num(ik.value),rp=num(ir.value);
      if(kg===null||kg<0||kg>600){ik.focus();return toast("Indique une charge valide (ex. 27,5)");}
      if(rp===null||rp<1||rp>(e.unit==="sec"?600:100)||rp!==Math.round(rp)){ir.focus();return toast(e.unit==="sec"?"Indique le nombre de secondes":"Indique le nombre de répétitions");}
      const past=pastEntries(e.uid),pb=past.length?Math.max(...past.map(best)):null;
      arr[j]={kg,reps:rp,t:Date.now()};if(!warm){te.n=seriesFor(e);if(cycleInfo().deload)te.dl=true;}cleanEntry(e.uid,te);persist();lockWake();
      const n=seriesFor(e),doneAll=W(te).length>=n;
      refreshCard(k,e);
      if(!warm&&pb!=null&&kg>pb)toast(`🏆 Nouveau record : ${fmt(kg)} kg`);
      else if(!warm&&pb!=null&&kg===pb){const br=Math.max(0,...past.map(x=>Math.max(0,...W(x).filter(s=>s.kg===pb).map(s=>s.reps))));
        if(rp>br&&!W(te).some((s,q)=>q!==j&&s.kg===kg&&s.reps>=rp))toast(`🏆 Record : ${rp} ${e.unit==="sec"?"secondes":"répétitions"}${kg>0?` à ${fmt(kg)} kg`:""}`);}
      const ex=P[k].exos,nx=ex.slice(ex.indexOf(e)+1).find(x=>!isFull(x));
      if(warm)startRest(60,"Échauffement · "+e.nom,e);
      else if(!doneAll){const nj=te.sets.findIndex((s,q)=>q<n&&!s);const next=nj<0?W(te).length+1:nj+1;startRest(restFor(e),`Repos · ensuite série ${Math.min(next,n)}/${n} · ${e.nom}`,e);}
      else if(nx)startRest(restFor(e),`Repos · ensuite : ${nx.nom}`,e);
      else stopRest();
    };
  });
}

function finish(k){
  const st=sessionStats(k);
  const doIt=()=>{if(!store.hist.some(h=>h.k===k&&h.d===today()))store.hist.push({d:today(),k});persist();stopRest();summary(k);render(true);};
  if(st.done<st.tot){openSheet(`<div class="shd"><h3>Terminer la séance ?</h3></div>
    <p>Il reste <b>${st.tot-st.done} séries</b> sur ${st.tot}. Elles ne seront pas comptées.</p>
    <div style="display:grid;gap:8px;margin-top:16px"><button class="btn wide" id="sk">Continuer la séance</button><button class="btn line wide" id="sf">Terminer quand même</button></div>`,
    ()=>{$("sk").onclick=closeSheet;$("sf").onclick=()=>{closeSheet();doIt();};});}
  else doIt();
}
function summary(k){
  let sets=0,vol=0,ts=[];const lines=[];
  P[k].exos.forEach(e=>{const te=todayEntry(e.uid);if(!te)return;W(te).forEach(s=>{sets++;vol+=s.kg*s.reps;if(s.t)ts.push(s.t);});
    const past=pastEntries(e.uid),l=past[past.length-1];if(l&&W(te).length){const d=best(te)-best(l);
      const pb=Math.max(...past.map(best));lines.push(`<li>${esc(e.nom)} : <b>${fmt(best(te))} kg</b>${d>0?` <span style="color:var(--go);font-weight:700">+${fmt(d)} kg</span>`:""}${best(te)>pb?" 🏆":""}</li>`);}});
  const dur=ts.length>1?Math.round((Math.max(...ts)-Math.min(...ts))/60000)+5:null;
  openSheet(`<div class="shd"><h3>Séance terminée, bravo !</h3><button class="close" id="sx" aria-label="Fermer">✕</button></div>
    <div class="stats"><div class="stat"><small>Durée</small><b>${dur?dur:"—"}<i> min</i></b></div><div class="stat"><small>Séries</small><b>${sets}</b></div><div class="stat"><small>Total soulevé</small><b>${Math.round(vol)}<i> kg</i></b></div></div>
    ${lines.length?`<h5>Par rapport à la dernière fois</h5><ul>${lines.join("")}</ul>`:""}
    <h5>Maintenant</h5><p>Un repas avec 30 à 40 g de protéines dans les 2 heures : 2 skyrs et une banane, ou 500 ml de lait avec 60 g de flocons d'avoine et un skyr, ou un vrai repas viande ou œufs avec des féculents.</p>
    <button class="btn wide" id="sok" style="margin-top:16px">Fermer</button>`,()=>{$("sx").onclick=closeSheet;$("sok").onclick=closeSheet;});
}

function pauseAdvice(w){
  if(w<=1)return {t:"Aucune perte.",d:"Une semaine sans t'entraîner ne te fait rien perdre. Souvent, on revient même un peu plus fort, reposé. Profite."};
  if(w<=3)return {t:"Presque rien.",d:"Jusqu'à environ 3 semaines, la force et le muscle se maintiennent presque entièrement. Le léger « dégonflement » que tu peux voir, c'est surtout de l'eau dans les muscles, pas du muscle perdu. 1 à 2 petites séances par semaine suffisent pour tout garder."};
  return {t:"Une petite perte, vite récupérée.",d:"Au-delà de 3-4 semaines sans rien faire, on commence à perdre un peu de force et de muscle. Mais la « mémoire musculaire » fait qu'on récupère beaucoup plus vite que la première fois. Le mieux : 1 à 2 séances d'entretien par semaine, environ un tiers de ton volume habituel, en gardant des séries dures. Ça suffit pour garder presque tout."};}

/* ===================== PROGRÈS ===================== */
function sparkline(pts,unit="kg",h=64){
  if(pts.length<3)return"";
  const Wd=300,pd=6,vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),sp=mx-mn||1;
  const X=i=>pd+i*(Wd-2*pd)/(pts.length-1),Y=v=>h-pd-((v-mn)/sp)*(h-2*pd-14);
  const d=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(""),l=pts.length-1;
  return `<div class="spark"><svg viewBox="0 0 ${Wd} ${h}" preserveAspectRatio="none" role="img" aria-label="Évolution de ${fmt(pts[0].v)} à ${fmt(pts[l].v)} ${unit}">
   <path d="${d}L${X(l)} ${h}L${X(0)} ${h}Z" fill="var(--go)" opacity=".12"/>
   <path d="${d}" fill="none" stroke="var(--go)" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
   <circle cx="${X(l)}" cy="${Y(pts[l].v)}" r="3.5" fill="var(--go)"/>
   <text x="${Wd-pd}" y="12" text-anchor="end" font-size="11" fill="var(--ink-3)">max ${fmt(mx)} ${unit}</text>
   <text x="${pd}" y="12" font-size="11" fill="var(--ink-3)">${fmt(pts[0].v)} ${unit}</text></svg></div>`;
}
