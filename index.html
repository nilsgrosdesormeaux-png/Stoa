    <h5>Pourquoi ${mmss(restFor(e))} de repos</h5><p>${e.rest>=90&&e.comp||e.rest>=120?"Gros exercice : plusieurs muscles, le souffle et le système nerveux fatiguent. Repartir trop tôt te fait perdre 2 à 3 répétitions à la série suivante.":"Petit muscle qui récupère vite : 1 min à 1 min 30 suffit."} Repars quand ton souffle est calme. Touche le chrono pour changer la durée, elle sera retenue pour cet exercice.</p>
    <h5>${BWU(e)?"Quoi noter":"Charge à noter"}</h5><p>${isUni(e)?"<b>Un côté à la fois :</b> toutes les répétitions d'un côté, puis l'autre. Note le nombre d'un seul côté. ":""}${e.unit==="haltere"?"Le poids d'un seul haltère (pas des deux). Exemple : deux haltères de 8 kg = note 8.":e.unit==="machine"?"Le chiffre affiché sur la machine. Si tu charges des disques toi-même : le total gauche + droite.":e.unit==="corps"?"Ton nombre de répétitions. Laisse la charge à 0, sauf si tu ajoutes un poids (sac à dos lesté…).":e.unit==="elastique"?"Ton nombre de répétitions. Quand c'est facile, prends un élastique plus dur.":e.unit==="sec"?"Le nombre de secondes tenues, dans la case des répétitions.":e.unit==="disques"?"Le total des disques que tu ajoutes, à gauche et à droite, sans le poids de la machine. Exemple : 20 kg de chaque côté = note 40 kg.":e.unit==="pile"?"Le chiffre de la pile de poids. Il ne se compare pas avec une autre machine.":"Le chiffre de la pile de la poulie."} Départ conseillé : <b>${e.depart}</b>.</p>
    <h5>${sal?"Si la machine est prise":"Autres options"}</h5><div class="alts">${(e.alt||[]).map(a=>`<div class="alt">${a.photo&&USE_GYM_PHOTOS?`<img src="${a.photo}" alt="">`:""}<span>${a.nom}</span></div>`).join("")}</div>`,
  ()=>{$("sx").onclick=closeSheet;
    $("phin").onchange=async ev=>{const f=ev.target.files[0];if(!f)return;try{const b=await compress(f);await idbPut(e.uid,b);if(PH[e.uid])URL.revokeObjectURL(PH[e.uid]);
      PH[e.uid]=URL.createObjectURL(b);closeSheet();render(true);toast("Photo enregistrée pour cette machine");}catch(err){toast("Impossible de lire cette photo");}};
    const d=$("phdel");if(d)d.onclick=async()=>{await idbDel(e.uid);URL.revokeObjectURL(PH[e.uid]);delete PH[e.uid];closeSheet();render(true);};});

/* ---------- feuille modale ---------- */
function openSheet(html,mount){const s=$("sheet"),bg=$("sheetbg");s.innerHTML=`<div class="grab"></div>${html}`;s.scrollTop=0;
  s.classList.remove("hidden");bg.classList.remove("hidden");requestAnimationFrame(()=>{s.classList.add("on");bg.classList.add("on");});if(mount)mount();}
function closeSheet(){const s=$("sheet"),bg=$("sheetbg");s.classList.remove("on");bg.classList.remove("on");setTimeout(()=>{s.classList.add("hidden");bg.classList.add("hidden");},230);}
$("sheetbg").onclick=closeSheet;

/* ===================== PROGRAMME ===================== */
/* ---------- vacances / pause : programme temporaire ---------- */
function pauseAdvice(w){

/* ===================== PROGRÈS ===================== */
function sparkline(pts,unit="kg",h=64){
  if(pts.length<3)return"";
  const Wd=300,pd=6,vs=pts.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),sp=mx-mn||1;
  const X=i=>pd+i*(Wd-2*pd)/(pts.length-1),Y=v=>h-pd-((v-mn)/sp)*(h-2*pd-14);
  const d=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(""),l=pts.length-1;
  return `<div class="spark"><svg viewBox="0 0 ${Wd} ${h}" preserveAspectRatio="none" role="img" aria-label="Évolution de ${fmt(pts[0].v)} à ${fmt(pts[l].v)} ${unit}">
   <path d="${d}L${X(l)} ${h}L${X(0)} ${h}Z" fill="var(--go)" opacity=".12"/>
   <path d="${d}" fill="none" stroke="var(--go)" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
   <circle cx="${X(l)}" cy="${Y(pts[l].v)}" r="3.5" fill="var(--go)"/>
   <text x="${Wd-pd}" y="12" text-anchor="end" font-size="11" fill="var(--ink-3)">max ${fmt(mx)} ${unit}</text>
   <text x="${pd}" y="12" font-size="11" fill="var(--ink-3)">${fmt(pts[0].v)} ${unit}</text></svg></div>`;
}

/* les exercices d'une partie du corps, du plus adapté au moins adapté (lieu, matériel, douleurs, préférences) */
function bCands(part,p,skip){
  const tk=envTokens(p),pain=p.pain||[],lvl=p.level||0,pref=p.pref||"mix",pats=BPARTS[part][1],sk=skip||[];
  const ok=LIB.concat(LIBB).filter(e=>pats.includes(e.pat)&&!sk.includes(e.uid)&&e.on.some(t=>tk.includes(t))&&!(e.not||[]).some(x=>tk.includes(x))
    &&!(e.avoid||[]).some(x=>pain.includes(x))&&(e.lvl||0)<=lvl+1&&!ruleOut(e,p));
  const sc=e=>{let s=-pats.indexOf(e.pat)*0.6+(e.comp?1:0);
    if(p.place==="salle"){if(BWU(e)&&e.pat!=="core"&&e.pat!=="hinge")s-=/pull|chinup|dip/i.test(e.uid)?(lvl>=2?0.5:2):6;
      if(pref==="machines"||(pref==="mix"&&lvl===0))s+=e.mach?3:e.unit==="poulie"?1.5:0;
      if(pref==="halteres")s+=e.unit==="haltere"?3:e.mach?-1:0;
      if(pref==="barres")s+=e.unit==="barre"?3.5:e.unit==="haltere"?1.5:e.mach?-1:0;}

/* un exercice prêt pour le programme : séries, répétitions, repos et charge de départ (mêmes règles que le générateur) */
function buildExo(e0,p,key,j){
  let e=Object.assign({},e0);
  if(p.gym==="onair"&&POOL[e.uid]){const o=POOL[e.uid];Object.assign(e,{nom:o.nom,reco:o.reco,how:o.how,alt:o.alt,unit:o.unit,inc:o.inc});}
  if(e.unit==="haltere"&&p.place!=="salle")e.inc=2;
  const comp=!!e.comp,bw=BWU(e),goal=p.goal||"muscle",lvl=p.level||0;
  let series=3,min,max,rest;
  if(goal==="force"){min=comp?5:8;max=comp?8:12;rest=comp?180:90;}
  else if(goal==="muscle"){min=comp?8:10;max=comp?12:15;rest=comp?120:75;}
  else if(goal==="gras"){min=comp?6:10;max=comp?10:15;rest=comp?120:75;}
  else{min=comp?10:12;max=15;rest=comp?90:60;}
  if(p.goal2==="force"&&goal!=="force"&&comp&&!bw){min=Math.min(min,6);max=Math.min(max,10);rest=Math.max(rest,150);}
  if((p.health||[]).some(x=>x==="coeur"||x==="malaise")&&!bw){min=Math.max(min,8);max=Math.max(max,12);rest=Math.max(rest,90);}
  if(bw){min=e.min;max=e.max;rest=comp?90:60;}
  else if(+p.age<18){min=Math.max(min,+p.age<16?10:8);max=Math.max(max,15);}
  /* mêmes règles que le générateur : grands débutants et moins de 18 ans 3 séries au plus (2 en isolation),
     plus de 55 ans : repos plus longs et 8-12 (sauf force confirmée), barre 6-10 avant 18 ans */
  if(lvl===0&&!comp)series=2;
  if(+p.age>=55){rest+=30;if(!bw&&!(goal==="force"&&lvl>=2)){min=Math.max(min,8);max=Math.max(max,12);}}
  if(+p.age<18&&e.unit==="barre"){min=6;max=10;}
  const L=Object.assign(estLoads(p),p.loads||{}),fam=LOWER.includes(e0.pat)?"legPress":["vpull","hpull","rear","bic"].includes(e0.pat)?"latPulldown":"benchPlate";
  const q=L[fam]/LIBX[fam].kg0,k=(e0.comp?q:e0.pat==="core"?Math.pow(q,0.4):Math.pow(q,0.65))*(e.unit==="haltere"?0.7:1);
  let kg0=bw?(e.unit==="elastique"?1:0):Math.max(e.unit==="haltere"?2:(e.inc||1),roundTo((e.kg0||10)*k,e.inc||1));
  if(e.unit==="haltere"&&p.place!=="salle"&&p.dbMax)kg0=p.dbFixed?p.dbMax:Math.min(kg0,p.dbMax);
  if(e.unit==="barre"){const bs=barStart(e,p);kg0=bs.kg;e.ramp=bs.ramp;}
  const alts=LIB.filter(x=>x.pat===e0.pat&&x.uid!==e.uid&&x.on.some(t=>envTokens(p).includes(t))).slice(0,3).map(x=>({nom:x.nom}));
  return Object.assign(e,{id:key.toLowerCase()+(j+1),series,min,max,rest,kg0,_b:1,
    depart:bw?(e.unit==="sec"?`${e.min} secondes`:e.unit==="elastique"?"l'élastique le plus souple":"poids du corps"):`${fmt(kg0)} kg (à ajuster)`,
    warm:comp&&!bw&&p.place==="salle",alt:e.alt&&p.gym==="onair"?e.alt:(alts.length?alts:[{nom:"Un autre exercice pour le même muscle"}])});
}
/* ordre conseillé : regroupés par zone (dans l'ordre où elles arrivent), gros exercices d'abord, abdos à la fin */
function bOrder(exos){const zones=[];exos.forEach(e=>{const z=BZONE[bPat(e)]||"autre";if(z!=="abdos"&&!zones.includes(z))zones.push(z);});zones.push("autre","abdos");
  const ISO=["calf","abd","add","latr","tri","rear","bic"],rank=e=>{const pt=bPat(e);return zones.indexOf(BZONE[pt]||"autre")*100+(e.comp?0:ISO.includes(pt)?20:10)+(e.opt?50:0);};
  const o=exos.slice();return o.sort((x,y)=>rank(x)-rank(y)||o.indexOf(x)-o.indexOf(y));}

function openBuilder(o){

function bFromProgram(f,onair,nils){const LP=liveP(f.P,onair,nils);

function obBuild(dir){const a=OB.a;

function bBack(){
  if(BD.stage==="deck"){if(BD.pi>0){BD.pi--;bDeckStart();}else BD.stage="parts";return bRender(-1);}
  if(BD.stage==="parts"){if(BD.cur>0&&!BD.S[BD.cur].exos.length){BD.cur--;BD.stage="recap";}else if(BD.S[BD.cur].exos.length||BD.src==="edit")BD.stage="recap";else BD.stage="setup";return bRender(-1);}

    if(BD.src==="onb"){const keep=BD;closeBuilder();BD=keep;obGo(-1);return;}

  const DEF={1:[0],2:[0,3],3:[0,2,4],4:[0,1,3,4],5:[0,1,2,4,5],6:[0,1,2,3,4,5],7:[0,1,2,3,4,5,6]},main=S.filter(s=>!s.bonus).map(s=>s.k),want=DEF[Math.min(7,main.length)]||[];

    nx.onclick=()=>{const mx=(a.level||0)>=2?6:5,n=(a.wdays||[]).length;if(n>=2&&n<=mx&&a.dur){a.days=n;obGo(1);}};return;}
  if(st.id==="swipe"||st.id==="zones"){
    const zn=st.id==="zones",cards=deckOf(st,a).cards;
    if(zn)a.zones=a.zones||{};
    const answer=(v,fly)=>{const c=cards[OB.sw];if(!c)return;
      if(zn){a.zones[c.id]=v==="skip"?"normal":v?"faible":"fort";
        a.focus=ZONES.map(z=>z[0]).filter(z=>a.zones[z]==="faible").slice(0,4);a.strong=ZONES.map(z=>z[0]).filter(z=>a.zones[z]==="fort");}
      else if(v==="skip")delete a.swipe[c.id];else a.swipe[c.id]=v;
      const card=$("obcard");if(card){card.style.transition="transform .32s ease,opacity .32s";card.style.transform=`translate(${fly||0}px,${fly?20:-30}px) rotate(${(fly||0)/14}deg)`;card.style.opacity="0";}
      if(!zn&&!OB.asked.includes(c.id))OB.asked.push(c.id);
      setTimeout(()=>{OB.sw++;if(OB.sw>=(zn?cards:deckOf(st,a).cards).length)obGo(1);else obRender();},260);};
    qa("[data-sw]").forEach(x=>x.onclick=()=>{const v=x.dataset.sw;answer(v==="skip"?"skip":v==="1",v==="skip"?0:v==="1"?420:-420);});
    const card=$("obcard");if(!card)return;
    let x0=null,dx=0,dy=0,y0=0;
    card.addEventListener("pointerdown",e=>{x0=e.clientX;y0=e.clientY;dx=0;card.setPointerCapture(e.pointerId);card.style.transition="none";});
    card.addEventListener("pointermove",e=>{if(x0==null)return;dx=e.clientX-x0;dy=e.clientY-y0;
      card.style.transform=`translate(${dx}px,${dy*.3}px) rotate(${dx/14}deg)`;
      card.querySelector(".yes").style.opacity=Math.max(0,Math.min(1,dx/90));card.querySelector(".no").style.opacity=Math.max(0,Math.min(1,-dx/90));});
    const up=()=>{if(x0==null)return;x0=null;
      if(Math.abs(dx)>90)answer(dx>0,dx>0?420:-420);
      else{card.style.transition="transform .3s cubic-bezier(.22,1,.36,1)";card.style.transform="";card.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0);}};
    card.addEventListener("pointerup",up);card.addEventListener("pointercancel",up);return;}
  if(st.id==="done"){
    $("obok").onchange=e=>{$("obgo").disabled=!e.target.checked;};
    $("obgo").onclick=()=>{
      const wasNils=!store.profile||store.profile.mode==="nils";
      const pr=JSON.parse(JSON.stringify(a));delete pr.name;pr.mode=a.how==="manual"?"manual":"gen";pr.ts=Date.now();
      if(OB.built){pr.frozen=snapOf(OB.built);if(a.how==="manual")pr.days=OB.built.KEYS.filter(k=>!OB.built.P[k].bonus).length;}
      if(wasNils&&(store.hist.length||Object.keys(store.log).length))store.nilsBack=true;
      store.profile=pr;if(a.name)store.name=a.name;
      if(a.weight&&!store.bw.some(x=>x.d===today())){store.bw.push({d:today(),kg:+a.weight});store.bw.sort((x,y)=>x.d<y.d?-1:1);}
      if(!store.hist.length)store.start=today();
      persist();applyProgram();sess=defaultSession();closeOnboarding();BD=null;tab="home";render();
      toast(`Ton programme est prêt${store.name?", "+esc(store.name):""} !`);};
  }
}

/* ===================== CHRONO ===================== */
let ti=null,tEnd=0,tTot=0,tEx=null,wake=null,actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  [0,.22,.44].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=t>.4?1320:880;
    g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.35,actx.currentTime+t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.18);o.connect(g);g.connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.2);});}catch(e){}}
async function lockWake(){try{if("wakeLock" in navigator&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>{wake=null;});}}catch(e){}}
function startRest(s,label,e){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(err){}
  clearInterval(ti);tTot=s;tEnd=Date.now()+s*1000;tEx=e||null;$("tlabel").textContent=label||"Souffle, bois une gorgée d'eau";
  const tm=$("timer");tm.classList.remove("hidden","end");tm.dataset.rang="";tick();ti=setInterval(tick,250);}
function stopRest(){clearInterval(ti);$("timer").classList.add("hidden");$("timer").classList.remove("end");}
function tick(){const ms=tEnd-Date.now(),l=Math.ceil(ms/1000),tm=$("timer");
  if(l>0){$("tdisp").textContent="Repos "+clock(l);$("tring").style.strokeDashoffset=138.2*(1-l/tTot);return;}
  /* fin du repos : un signal, puis le chrono s'arrête et disparaît */
  clearInterval(ti);tm.classList.add("end");$("tdisp").textContent="C'est reparti !";$("tlabel").textContent="Repos terminé : lance ta série";
  if(tm.dataset.rang!=="1"){tm.dataset.rang="1";beep();try{navigator.vibrate&&navigator.vibrate([400,150,400]);}catch(e){}}
  setTimeout(()=>{if(tm.classList.contains("end"))stopRest();},6000);}
function keepRest(d){if(!tEx)return;const v=Math.max(30,Math.min(300,restFor(tEx)+d));if(v===tEx.rest)delete store.rest[tEx.uid];else store.rest[tEx.uid]=v;persist();
  clearTimeout(keepRest.t);keepRest.t=setTimeout(()=>toast(`Repos de ${mmss(restFor(tEx))} retenu pour cet exercice`),700);}
$("tminus").onclick=()=>{if(Date.now()>tEnd)return;tEnd-=15000;tTot=Math.max(tTot-15,1);keepRest(-15);tick();};
$("tplus").onclick=()=>{if(Date.now()>tEnd){startRest(15,"Encore 15 secondes",tEx);return;}tEnd+=15000;tTot+=15;keepRest(15);tick();};
$("tstop").onclick=stopRest;
$("tbox").onclick=()=>{const e=tEx,cur=e?restFor(e):tTot;
  openSheet(`<div class="shd"><h3>Durée du repos</h3><button class="close" id="sx" aria-label="Fermer">✕</button></div>
    ${e?`<p class="small" style="margin-bottom:12px">Pour <b>${esc(e.nom)}</b>. Conseillé : ${mmss(e.rest)}. Ton choix sera retenu pour cet exercice.</p>`:""}
    <div class="presets">${[60,75,90,120,150,180].map(s=>`<button data-r="${s}" class="${s===cur?"on":""}">${clock(s)}</button>`).join("")}</div>
    ${e&&store.rest[e.uid]?`<button class="btn line wide" id="rreset" style="margin-top:12px">Revenir au conseil (${mmss(e.rest)})</button>`:""}`,
  ()=>{$("sx").onclick=closeSheet;
    $("sheet").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const s=+b.dataset.r;if(e){if(s===e.rest)delete store.rest[e.uid];else store.rest[e.uid]=s;persist();}
      const done=tTot-Math.max(0,Math.ceil((tEnd-Date.now())/1000));tTot=s;tEnd=Date.now()+Math.max(1,s-done)*1000;$("timer").classList.remove("end");$("timer").dataset.rang="";clearInterval(ti);ti=setInterval(tick,250);tick();closeSheet();if(tab==="today")render(true);});
    const rr=$("rreset");if(rr)rr.onclick=()=>{delete store.rest[e.uid];persist();closeSheet();if(tab==="today")render(true);};});};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){if(!$("timer").classList.contains("hidden")){lockWake();tick();}}});

/* ===================== EXERCICES EN SECONDES : COMPTE À REBOURS =====================
   ▶ dans la ligne de série : 3 s pour se placer, puis la durée visée (un côté puis l'autre si besoin).
   À la fin : bip et vibration, les secondes tenues s'inscrivent dans la case (modifiable). « Arrêter » garde le temps tenu. */
let HOLD=null;
function holdStart(e,inp){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(err){}
  if(HOLD)holdEnd(false);stopRest();lockWake();
  const T=Math.max(5,Math.min(600,Math.round(num(inp.value)||e.min||20))),sides=isUni(e)?2:1;
  const el=document.createElement("div");el.className="hold";el.id="hold";el.setAttribute("role","dialog");el.setAttribute("aria-label","Compte à rebours");
  el.innerHTML=`<div class="hold-box"><small id="hlab">Mets-toi en place</small><div class="hold-ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="bg"/><circle cx="60" cy="60" r="52" class="fg" id="hfg"/></svg><b id="hnum" class="num">3</b></div>
    <p id="hsub">${esc(e.nom)}</p><button class="btn line wide" id="hstop">Arrêter</button></div>`;
  document.body.appendChild(el);
  HOLD={e,inp,T,sides,side:1,phase:"lead",t0:Date.now(),got:[]};
  $("hstop").onclick=()=>holdEnd(true);HOLD.iv=setInterval(holdTick,100);holdTick();}
function holdTick(){const h=HOLD;if(!h)return;const el=(Date.now()-h.t0)/1000,fg=$("hfg");
  const lead=h.phase==="lead"?3:h.phase==="switch"?5:0,L=h.phase==="hold"?h.T:lead,left=Math.max(0,Math.ceil(L-el));
  $("hnum").textContent=left;fg.style.strokeDashoffset=326.7*(1-Math.min(1,el/L));
  $("hlab").textContent=h.phase==="lead"?"Mets-toi en place":h.phase==="switch"?"Change de côté":h.sides>1?`Tiens ! Côté ${h.side}`:"Tiens !";
  $("hold").classList.toggle("go",h.phase==="hold");
  if(el<L)return;
  if(h.phase!=="hold"){h.phase="hold";h.t0=Date.now();try{navigator.vibrate&&navigator.vibrate(80);}catch(e){}return;}
  h.got.push(h.T);beep();try{navigator.vibrate&&navigator.vibrate([400,150,400]);}catch(e){}
  if(h.side<h.sides){h.side++;h.phase="switch";h.t0=Date.now();return;}
  holdEnd(true);}
function holdEnd(save){const h=HOLD;if(!h)return;clearInterval(h.iv);HOLD=null;
  if(save&&h.phase==="hold"&&h.got.length<h.side)h.got.push(Math.floor((Date.now()-h.t0)/1000));
  const v=h.got.length?Math.min(...h.got):null,el=$("hold");
  if(save&&v!=null){h.inp.value=v;h.inp.classList.remove("sug");
    if(el){el.classList.add("done");$("hlab").textContent=v>=h.T?"Bravo !":"Temps noté";$("hnum").textContent=v;$("hsub").textContent=`${v} s ${h.sides>1?"par côté ":""}notées : touche ✓ pour valider la série`;$("hstop").textContent="OK";$("hstop").onclick=()=>el.remove();
      setTimeout(()=>{if(el.isConnected)el.remove();},2500);return;}}
  if(el)el.remove();}

/* ===================== THÈME ===================== */
const TH=["auto","light","dark"],THI={auto:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'};
let theme="auto";
/* ambiances de couleur : g = dégradé des boutons, t = teinte du fond sombre, l = teinte du fond clair */
const ACC={rouge:{n:"Rouge",d:"L'original, intense",g:["#FF4757","#E8132B","#9E0B1E"],t:"#1A0B0E",l:"#F7EEEF"},
  rose:{n:"Rose",d:"Doux et élégant",g:["#F19BBB","#C94D7E","#963A63"],t:"#1C0D14",l:"#F8EEF2"},
  ocean:{n:"Océan",d:"Bleu, calme et frais",g:["#5DA9FF","#2B7BE0","#14489A"],t:"#0A1220",l:"#EDF2F9"},
  violet:{n:"Violet",d:"Profond et moderne",g:["#B08CFF","#8250EE","#5328B8"],t:"#120D1F",l:"#F1EEF9"}};
const accent=()=>ACC[store&&store.accent]?store.accent:(()=>{try{const a=localStorage.getItem(KEY+"-accent");return ACC[a]?a:"rouge";}catch(e){return "rouge";}})();
function applyTheme(){const r=document.documentElement;if(theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",theme);
  const ac=accent();if(ac==="rouge")r.removeAttribute("data-accent");else r.setAttribute("data-accent",ac);
  $("themeBtn").innerHTML=THI[theme];$("themeBtn").setAttribute("aria-label","Apparence : couleurs et thème");
  const dark=theme==="dark"||(theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m=>{m.setAttribute("content",dark?ACC[ac].t:ACC[ac].l);});}
function setAccent(a){if(!ACC[a])return;store.accent=a;try{localStorage.setItem(KEY+"-accent",a);}catch(e){}persist();applyTheme();}
/* petit aperçu d'une ambiance (anneau, bouton, flamme) */
function accPrev(a){const c=ACC[a].g;return `<svg viewBox="0 0 120 64" aria-hidden="true"><defs><linearGradient id="ap-${a}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[2]}"/></linearGradient></defs>
  <rect width="120" height="64" rx="12" fill="${ACC[a].t}"/><circle cx="30" cy="32" r="17" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="6"/>
  <path d="M30 15a17 17 0 1 1-16.2 22" fill="none" stroke="url(#ap-${a})" stroke-width="6" stroke-linecap="round"/>
  <rect x="58" y="18" width="50" height="12" rx="6" fill="url(#ap-${a})"/><rect x="58" y="38" width="34" height="7" rx="3.5" fill="rgba(255,255,255,.25)"/></svg>`;}
function lookSheet(){const ac=accent();
  openSheet(`<div class="shd"><h3>Apparence</h3><button class="close" id="sx" aria-label="Fermer">✕</button></div>
    <h5>Couleur</h5><div class="accs">${Object.keys(ACC).map(a=>`<button class="acc ${a===ac?"on":""}" data-acc="${a}" aria-label="Couleur ${ACC[a].n}">${accPrev(a)}<b>${ACC[a].n}</b><small>${ACC[a].d}</small></button>`).join("")}</div>
    <h5>Clair ou sombre</h5><div class="presets">${TH.map(t=>`<button data-th="${t}" class="${t===theme?"on":""}" style="font-size:15px">${{auto:"Auto",light:"Clair",dark:"Sombre"}[t]}</button>`).join("")}</div>
    <p class="small muted" style="margin-top:10px">Auto suit le réglage de ton téléphone.</p>`,
  ()=>{$("sx").onclick=closeSheet;const S=$("sheet");
    S.querySelectorAll("[data-acc]").forEach(b=>b.onclick=()=>{setAccent(b.dataset.acc);S.querySelectorAll("[data-acc]").forEach(x=>x.classList.toggle("on",x===b));render(true);});
    S.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{theme=b.dataset.th;try{localStorage.setItem(KEY+"-theme",theme);}catch(e){}applyTheme();S.querySelectorAll("[data-th]").forEach(x=>x.classList.toggle("on",x===b));render(true);});});}
$("themeBtn").onclick=lookSheet;

/* ===================== DÉMARRAGE ===================== */
document.querySelectorAll("#tabbar button").forEach(b=>b.onclick=()=>{if(b.dataset.tab===tab){window.scrollTo({top:0,behavior:"smooth"});return;}if(b.dataset.tab==="today")sess=defaultSession();go(b.dataset.tab);});
$("bwchip").onclick=()=>{go("prog");setTimeout(()=>{const i=$("bwin");if(i)i.focus();},50);};
window.addEventListener("scroll",()=>$("top").classList.toggle("scrolled",window.scrollY>4),{passive:true});
try{theme=localStorage.getItem(KEY+"-theme")||localStorage.getItem(OLDKEY+"-theme")||"dark";}catch(e){theme="dark";}
applyTheme();loadLocal();applyTheme();applyProgram();sess=defaultSession();render();if(!store.profile)openOnboarding();
if(store.backToast){delete store.backToast;persist();setTimeout(()=>toast("Fin du programme temporaire : ton programme habituel est de retour !"),600);}
openIDB().then(idbAll).then(()=>{if(Object.keys(PH).length)render(true);});
initCloud();
/* mises à jour : on vérifie à chaque retour dans l'app ; une nouvelle version s'installe toute seule */
if("serviceWorker" in navigator&&location.protocol==="https:"&&!inFrame){
  const hadCtrl=!!navigator.serviceWorker.controller;let hiddenAt=0;
  navigator.serviceWorker.register("sw.js").then(reg=>{
    document.addEventListener("visibilitychange",()=>{
      if(document.visibilityState==="hidden"){hiddenAt=Date.now();return;}
      reg.update().catch(()=>{});
      /* iPhone : l'app reste en mémoire ; après 30 min d'absence, on recharge pour prendre la dernière version */
      if(hiddenAt&&Date.now()-hiddenAt>30*60*1000&&$("timer").classList.contains("hidden"))location.reload();});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!hadCtrl)return;
    if($("timer").classList.contains("hidden"))location.reload();
    else toast("Nouvelle version de Stoa prête","Mettre à jour",()=>location.reload());});
}
